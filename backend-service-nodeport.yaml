# backend-service-nodeport.yaml
# Change backend service to NodePort for external browser access

apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: bd-bd-gr-08
  labels:
    app: backend
spec:
  type: NodePort  # ← Changed from ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30800  # ← External port (30000-32767 range)
  selector:
    app: backend
