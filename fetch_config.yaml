# Energy Data Service API Configuration
energy:
  api_url: "https://api.energidataservice.dk/dataset/ProductionMunicipalityHour"

# Processing Options
processing:
  # Filter to hourly data only (00:00, 01:00, 02:00, etc.)
  hourly_only: true

  # Output format: "wide" (parameters as columns) or "long" (one row per parameter)
  format: "wide"

  # Sort energy data by municipality (to match weather station sorting)
  sort_energy: true

# Output Configuration
output:
  directory: "data"
  compression: "snappy"
