apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-weather-fetcher
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realtime-weather-fetcher
  template:
    metadata:
      labels:
        app: realtime-weather-fetcher
    spec:
      containers:
      - name: fetcher
        image: dummystad/bigdata:fetcher-latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "Starting real-time weather fetcher..."
            python3 /app/scripts/fetch_realtime_weather.py
        env:
        - name: DMI_API_KEY
          value: "b5800a05-4f0f-4584-b130-6129213728c0"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "{{ .Release.Name }}-energy-cluster:9092"
        - name: KAFKA_TOPIC
          value: "weather_hourly_ml"
        - name: FETCH_INTERVAL
          value: "3600"  # 1 hour
      restartPolicy: Always