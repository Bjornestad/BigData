apiVersion: v1
kind: ConfigMap
metadata:
  name: dmi-api-config
data:
  API_KEY: "b5800a05-4f0f-4584-b130-6129213728c0"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fetch-historical-weather
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: data-fetch
        type: weather
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-hive
          image: busybox:latest
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              echo "Waiting for Hive Metastore..."
              until nc -z -v -w30 hive-metastore 9083; do
                echo "Waiting for Hive Metastore (hive-metastore:9083)..."
                sleep 5
              done
              echo "Hive Metastore is ready!"
      containers:
        - name: fetcher
          image: dummystad/bigdata:fetcher-latest
          imagePullPolicy: Always
          command: ["python", "/app/scripts/fetch_historical_weather.py"]
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          env:
            - name: DATA_DIR
              value: "/data"
            - name: DMI_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: dmi-api-config
                  key: API_KEY
          volumeMounts:
            - name: shared-data
              mountPath: /data
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: weather-data-pvc
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fetch-historical-energy
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: data-fetch
        type: energy
    spec:
      restartPolicy: OnFailure
      containers:
        - name: fetcher
          image: dummystad/bigdata:fetcher-latest
          imagePullPolicy: Always
          command: ["python", "/app/scripts/fetch_historical_energy.py"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          env:
            - name: DATA_DIR
              value: "/data"
          volumeMounts:
            - name: shared-data
              mountPath: /data
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: weather-data-pvc
