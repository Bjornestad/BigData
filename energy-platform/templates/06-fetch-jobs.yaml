apiVersion: batch/v1
kind: Job
metadata:
  name: fetch-historical-energy
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-namenode
          image: busybox:1.28
          command: ['sh', '-c', 'until nc -z namenode 9870; do echo "Waiting for NameNode..."; sleep 2; done;']
      containers:
        - name: fetcher
          image: dummystad/bigdata:fetcher-latest
          imagePullPolicy: Always # Force pull to get latest changes
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Starting historical energy data fetch..."
              python3 /app/scripts/fetch_historical_energy.py --start-date "2021-01-01" --end-date "2026-01-01"
          volumeMounts:
            - name: data-volume
              mountPath: /data
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: weather-data-pvc # Updated to match existing PVC
---
