apiVersion: v1
kind: ConfigMap
metadata:
  name: replay-script
  namespace: {{ .Release.Namespace }}
data:
  replay_to_kafka.py: |
    import os
    import time
    import json
    import subprocess
    import pandas as pd
    import numpy as np
    from confluent_kafka import Producer, KafkaError
    from confluent_kafka.serialization import SerializationContext, MessageField
    from confluent_kafka.schema_registry import SchemaRegistryClient
    from confluent_kafka.schema_registry.avro import AvroSerializer
    from datetime import datetime, date

    # Configuration
    KAFKA_BOOTSTRAP_SERVERS = os.getenv("KAFKA_BOOTSTRAP_SERVERS", "localhost:9092")
    SCHEMA_REGISTRY_URL = os.getenv("SCHEMA_REGISTRY_URL", "http://schema-registry:8081")

    # Topics
    WEATHER_TOPIC = "weather_raw_avro"
    ENERGY_TOPIC = "energy_actual"

    # HDFS Paths
    HDFS_ENERGY_PATH = "hdfs://namenode:9000/user/hive/warehouse/energy_actual"
    HDFS_WEATHER_PATH = "hdfs://namenode:9000/user/hive/warehouse/weather_observations_historical"

    # Local temp dir
    TEMP_DIR = "/tmp/replay_data"

    # Wait settings
    MAX_WAIT_MINUTES = 20
    CHECK_INTERVAL_SECONDS = 30

    # --- Avro Schemas ---
    WEATHER_AVRO_SCHEMA = """{
        "type": "record",
        "name": "WeatherObservation",
        "namespace": "dk.weather",
        "fields": [
            {"name": "stationId", "type": ["null", "string"], "default": null},
            {"name": "timeObserved", "type": ["null", "string"], "default": null},
            {"name": "parameterId", "type": ["null", "string"], "default": null},
            {"name": "value", "type": ["null", "double"], "default": null}
        ]
    }"""

    ENERGY_AVRO_SCHEMA = """{
        "type": "record",
        "name": "EnergyConsumptionRaw",
        "namespace": "dk.energy",
        "fields": [
            {"name": "HourUTC", "type": "string"},
            {"name": "HourDK", "type": "string"},
            {"name": "PriceArea", "type": "string"},
            {"name": "ConnectedArea", "type": "string"},
            {"name": "ViaArea", "type": "string"},
            {"name": "SharePPM", "type": ["null", "long"], "default": null},
            {"name": "ShareMWh", "type": ["null", "double"], "default": null},
            {"name": "Updated", "type": "string"}
        ]
    }"""

    def run_hdfs_cmd(cmd):
        """Run HDFS command and return output"""
        try:
            full_cmd = ['hdfs', 'dfs'] + cmd
            result = subprocess.run(full_cmd, capture_output=True, text=True, check=True)
            return result.stdout.strip()
        except subprocess.CalledProcessError as e:
            print(f"HDFS Error: {e.stderr}")
            return None

    def list_hdfs_files(hdfs_path):
        """Recursively list parquet files in HDFS path"""
        print(f"Listing files in {hdfs_path}...")
        # -ls -R lists recursively
        output = run_hdfs_cmd(['-ls', '-R', hdfs_path])
        if not output:
            return []

        files = []
        for line in output.split('\n'):
            parts = line.split()
            if len(parts) >= 8:
                path = parts[-1]
                if path.endswith('.parquet'):
                    files.append(path)
        return files

    def wait_for_data():
        """Wait until data files appear in HDFS."""
        print(f"Checking HDFS for data...")
        start_time = time.time()

        while True:
            energy_files = list_hdfs_files(HDFS_ENERGY_PATH)
            weather_files = list_hdfs_files(HDFS_WEATHER_PATH)

            if energy_files or weather_files:
                print(f"Found {len(energy_files)} energy files and {len(weather_files)} weather files in HDFS.")
                if len(energy_files) >= 1: # Weather might be slow, start if energy is there
                    print("Sufficient data found. Starting bulk load.")
                    return energy_files, weather_files
                else:
                    print(f"Waiting for energy data...")

            elapsed = (time.time() - start_time) / 60
            if elapsed > MAX_WAIT_MINUTES:
                print(f"Timeout reached ({MAX_WAIT_MINUTES} min). Starting with whatever data we have.")
                return energy_files, weather_files

            time.sleep(CHECK_INTERVAL_SECONDS)

    def create_avro_producer_and_serializers():
        """Create a Kafka producer and Avro serializers."""
        try:
            producer_conf = {
                'bootstrap.servers': KAFKA_BOOTSTRAP_SERVERS,
                'batch.size': 131072,
                'linger.ms': 20,
                'compression.type': 'gzip',
                'queue.buffering.max.messages': 100000,
                'queue.buffering.max.kbytes': 1048576
            }
            producer = Producer(producer_conf)

            schema_registry_conf = {'url': SCHEMA_REGISTRY_URL}
            schema_registry_client = SchemaRegistryClient(schema_registry_conf)

            weather_serializer = AvroSerializer(
                schema_registry_client,
                WEATHER_AVRO_SCHEMA,
                lambda obj, ctx: obj
            )
            energy_serializer = AvroSerializer(
                schema_registry_client,
                ENERGY_AVRO_SCHEMA,
                lambda obj, ctx: obj
            )

            print(f"Connected to Kafka at {KAFKA_BOOTSTRAP_SERVERS}")
            return producer, weather_serializer, energy_serializer
        except Exception as e:
            print(f"Failed to connect to Kafka/Schema Registry: {e}")
            return None, None, None

    def delivery_report(err, msg):
        """Kafka delivery callback."""
        if err is not None:
            # Don't print every error to avoid log spam, but print first few
            pass

    def clean_record(record):
        """Replace NaN/Infinity with None and format dates."""
        cleaned = {}
        for k, v in record.items():
            if isinstance(v, float) and (np.isnan(v) or np.isinf(v)):
                cleaned[k] = None
            elif isinstance(v, (pd.Timestamp, datetime, date)):
                cleaned[k] = v.isoformat()
            else:
                cleaned[k] = v
        return cleaned

    def process_file(producer, serializer, hdfs_path, topic, required_columns, column_mapping=None):
        """Download file from HDFS, process, and send to Kafka with Avro."""
        filename = os.path.basename(hdfs_path)
        local_path = os.path.join(TEMP_DIR, filename)

        print(f"Downloading {hdfs_path} -> {local_path}")
        if run_hdfs_cmd(['-get', '-f', hdfs_path, local_path]) is None:
            print(f"Failed to download {hdfs_path}")
            return

        try:
            df = pd.read_parquet(local_path)

            # Rename columns if mapping provided
            if column_mapping:
                df = df.rename(columns=column_mapping)

            # Ensure required columns exist
            for col in required_columns:
                if col not in df.columns:
                    df[col] = None

            records = df.to_dict(orient='records')
            print(f"  -> Sending {len(records)} records to {topic}...")

            count = 0
            for record in records:
                cleaned = clean_record(record)

                # Create key
                key_fields = [str(cleaned[k]) for k in [required_columns[0], required_columns[1]] if k in cleaned and cleaned[k] is not None]
                key = "_".join(key_fields)

                serialized_value = serializer(
                    cleaned,
                    SerializationContext(topic, MessageField.VALUE)
                )

                # Retry loop for queue full
                while True:
                    try:
                        producer.produce(
                            topic=topic,
                            key=key.encode('utf-8'),
                            value=serialized_value,
                            on_delivery=delivery_report
                        )
                        break
                    except BufferError:
                        # Queue is full, poll to free up space
                        producer.poll(0.1)

                count += 1
                if count % 10000 == 0:
                    producer.poll(0)

            producer.flush()
        except Exception as e:
            print(f"Error processing {local_path}: {e}")
            import traceback
            traceback.print_exc()
        finally:
            if os.path.exists(local_path):
                os.remove(local_path)

    def main():
        print("Starting Bulk Loader Job (HDFS Source + Avro)...")
        os.makedirs(TEMP_DIR, exist_ok=True)

        # Ensure HDFS client is ready
        if run_hdfs_cmd(['-ls', '/']) is None:
            print("Error: Cannot contact HDFS NameNode.")
            return

        energy_files, weather_files = wait_for_data()

        if not energy_files and not weather_files:
            print("No data found in HDFS.")
            return

        producer, weather_serializer, energy_serializer = create_avro_producer_and_serializers()
        if not producer:
            return

        # Sort files
        energy_files.sort()
        weather_files.sort()

        print("--- Processing Energy Data ---")
        energy_cols = ["HourUTC", "HourDK", "PriceArea", "ConnectedArea", "ViaArea", "SharePPM", "ShareMWh", "Updated"]
        for f in energy_files:
            process_file(producer, energy_serializer, f, ENERGY_TOPIC, energy_cols)

        print("--- Processing Weather Data ---")
        weather_cols = ["stationId", "timeObserved", "parameterId", "value"]
        weather_mapping = {
            "station_id": "stationId",
            "observed": "timeObserved",
            "parameter_id": "parameterId"
        }
        for f in weather_files:
            process_file(producer, weather_serializer, f, WEATHER_TOPIC, weather_cols, weather_mapping)

        print("Bulk load complete.")
        producer.flush()

    if __name__ == "__main__":
        main()
