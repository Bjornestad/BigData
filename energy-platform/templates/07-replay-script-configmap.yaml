apiVersion: v1
kind: ConfigMap
metadata:
  name: replay-script
  namespace: {{ .Release.Namespace }}
data:
  replay_to_kafka.py: |
    import os
    import time
    import json
    import subprocess
    import pandas as pd
    import numpy as np
    from kafka import KafkaProducer
    from datetime import datetime, date

    # Configuration
    KAFKA_BOOTSTRAP_SERVERS = os.getenv("KAFKA_BOOTSTRAP_SERVERS", "localhost:9092")
    WEATHER_TOPIC = "weather_raw_avro"
    ENERGY_TOPIC = "energy_actual"

    # HDFS Paths
    HDFS_ENERGY_PATH = "/user/hive/warehouse/energy_actual"
    HDFS_WEATHER_PATH = "/user/hive/warehouse/weather_observations_historical"

    # Local temp dir
    TEMP_DIR = "/tmp/replay_data"

    # Wait settings
    MAX_WAIT_MINUTES = 20
    CHECK_INTERVAL_SECONDS = 30

    class DateTimeEncoder(json.JSONEncoder):
        def default(self, obj):
            if isinstance(obj, (datetime, date, pd.Timestamp)):
                return obj.isoformat()
            if isinstance(obj, (np.int64, np.int32, np.int16)):
                return int(obj)
            if isinstance(obj, (np.float64, np.float32)):
                return float(obj)
            return super(DateTimeEncoder, self).default(obj)

    def run_hdfs_cmd(cmd):
        """Run HDFS command and return output"""
        try:
            full_cmd = ['hdfs', 'dfs'] + cmd
            result = subprocess.run(full_cmd, capture_output=True, text=True, check=True)
            return result.stdout.strip()
        except subprocess.CalledProcessError as e:
            print(f"HDFS Error: {e.stderr}")
            return None

    def list_hdfs_files(hdfs_path):
        """Recursively list parquet files in HDFS path"""
        print(f"Listing files in {hdfs_path}...")
        # -ls -R lists recursively
        output = run_hdfs_cmd(['-ls', '-R', hdfs_path])
        if not output:
            return []

        files = []
        for line in output.split('\n'):
            parts = line.split()
            if len(parts) >= 8:
                path = parts[-1]
                if path.endswith('.parquet'):
                    files.append(path)
        return files

    def wait_for_data():
        """Wait until data files appear in HDFS."""
        print(f"Checking HDFS for data...")
        start_time = time.time()

        while True:
            energy_files = list_hdfs_files(HDFS_ENERGY_PATH)
            weather_files = list_hdfs_files(HDFS_WEATHER_PATH)

            if energy_files or weather_files:
                print(f"Found {len(energy_files)} energy files and {len(weather_files)} weather files in HDFS.")
                if len(energy_files) >= 1: # Weather might be slow, start if energy is there
                    print("Sufficient data found. Starting bulk load.")
                    return energy_files, weather_files
                else:
                    print(f"Waiting for energy data...")

            elapsed = (time.time() - start_time) / 60
            if elapsed > MAX_WAIT_MINUTES:
                print(f"Timeout reached ({MAX_WAIT_MINUTES} min). Starting with whatever data we have.")
                return energy_files, weather_files

            time.sleep(CHECK_INTERVAL_SECONDS)

    def create_producer():
        """Create a Kafka producer instance."""
        try:
            producer = KafkaProducer(
                bootstrap_servers=KAFKA_BOOTSTRAP_SERVERS,
                value_serializer=lambda v: json.dumps(v, cls=DateTimeEncoder).encode('utf-8'),
                retries=5,
                batch_size=131072,
                linger_ms=20,
                compression_type='gzip'
            )
            print(f"Connected to Kafka at {KAFKA_BOOTSTRAP_SERVERS}")
            return producer
        except Exception as e:
            print(f"Failed to connect to Kafka: {e}")
            return None

    def clean_record(record):
        """Replace NaN/Infinity with None for JSON compliance."""
        cleaned = {}
        for k, v in record.items():
            if isinstance(v, float) and (np.isnan(v) or np.isinf(v)):
                cleaned[k] = None
            else:
                cleaned[k] = v
        return cleaned

    def process_energy_record(record):
        record = clean_record(record)
        # Ensure timestamp is present for Database Writer
        if 'HourDK' in record:
             record['timestamp'] = record['HourDK'] # Encoder will handle conversion
        return record

    def process_weather_record(record):
        record = clean_record(record)
        if 'timeObserved' in record:
             record['timestamp'] = record['timeObserved']
        return record

    def process_file(producer, hdfs_path, topic, process_func):
        """Download file from HDFS, process, and delete"""
        filename = os.path.basename(hdfs_path)
        local_path = os.path.join(TEMP_DIR, filename)

        print(f"Downloading {hdfs_path} -> {local_path}")
        if run_hdfs_cmd(['-get', '-f', hdfs_path, local_path]) is None:
            print(f"Failed to download {hdfs_path}")
            return

        try:
            df = pd.read_parquet(local_path)
            records = df.to_dict(orient='records')
            print(f"  -> Sending {len(records)} records to {topic}...")

            for record in records:
                payload = process_func(record)
                producer.send(topic, payload)

            producer.flush()
        except Exception as e:
            print(f"Error processing {local_path}: {e}")
            import traceback
            traceback.print_exc()
        finally:
            if os.path.exists(local_path):
                os.remove(local_path)

    def bulk_load_data(producer, energy_files, weather_files):
        """Load all data and push to Kafka."""
        os.makedirs(TEMP_DIR, exist_ok=True)

        # Sort files to process in chronological order (roughly)
        energy_files.sort()
        weather_files.sort()

        print("--- Processing Energy Data ---")
        for f in energy_files:
            process_file(producer, f, ENERGY_TOPIC, process_energy_record)

        print("--- Processing Weather Data ---")
        for f in weather_files:
            process_file(producer, f, WEATHER_TOPIC, process_weather_record)

        print("Bulk load complete.")

    def main():
        print("Starting Bulk Loader Job (HDFS Source)...")

        # Ensure HDFS client is ready
        if run_hdfs_cmd(['-ls', '/']) is None:
            print("Error: Cannot contact HDFS NameNode.")
            return

        energy_files, weather_files = wait_for_data()

        if not energy_files and not weather_files:
            print("No data found in HDFS.")
            return

        producer = create_producer()
        if not producer:
            return

        bulk_load_data(producer, energy_files, weather_files)

        producer.close()
        print("Job finished successfully.")

    if __name__ == "__main__":
        main()
