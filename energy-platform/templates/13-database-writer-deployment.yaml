apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-writer
  namespace: {{ .Release.Namespace }}
  labels:
    app: database-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database-writer
  template:
    metadata:
      labels:
        app: database-writer
    spec:
      # Init container to wait for Kafka to be ready
      initContainers:
      - name: wait-for-kafka
        image: public.ecr.aws/bitnami/kafka:3.6.1
        command:
        - sh
        - -c
        - |
          echo "Waiting for Kafka broker to be ready..."
          until kafka-broker-api-versions.sh --bootstrap-server {{ .Release.Name }}-energy-cluster:9092 > /dev/null 2>&1; do
            echo "Kafka not ready yet, waiting 5 seconds..."
            sleep 5
          done
          echo "Kafka broker is ready!"
      
      containers:
      - name: database-writer
        image: {{ .Values.database_writer.image.repository }}:{{ .Values.database_writer.image.tag | default "latest" }}
        imagePullPolicy: {{ .Values.database_writer.image.pullPolicy }}
        env:
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: KAFKA_BROKERS
        - name: ACTUAL_TOPIC
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: ACTUAL_TOPIC
        - name: PREDICTED_TOPIC
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: PREDICTED_TOPIC
        - name: WEATHER_TOPIC
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: WEATHER_TOPIC
        - name: CONSUMER_GROUP
          value: "database-writer"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: timescaledb-secret
              key: connection-string
        - name: BATCH_SIZE
          value: "1000"
        - name: FLUSH_INTERVAL
          value: "10000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Startup probe - gives more time for initial connection
        startupProbe:
          httpGet:
            path: /health
            port: 8081
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
