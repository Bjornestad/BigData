apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregate-and-predict-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aggregate-and-predict
  template:
    metadata:
      labels:
        app: aggregate-and-predict
    spec:
      containers:
      - name: service
        image: dummystad/bigdata:prediction-service-latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "Starting aggregate and predict service..."
            cd /app/SparkML
            python3 -u aggregate_and_predict_service.py
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "{{ .Release.Name }}-energy-cluster:9092"
        - name: OUTPUT_TOPIC
          value: "energy_predictions"
        - name: CONSUMPTION_MODEL_PATH
          value: "hdfs://namenode:9000/user/hive/warehouse/models"
        - name: EVENT_DRIVEN_MODE
          value: "true"
        - name: WEATHER_INPUT_TOPIC
          value: "weather_raw_avro"
        - name: ENERGY_INPUT_TOPIC
          value: "energy_actual"
        - name: CHECK_INTERVAL
          value: "600"  # 10 minutes
        - name: JAVA_HOME
          value: "/opt/java/openjdk"
        - name: TRAIN_ON_STARTUP
          value: "{{ .Values.prediction.trainOnStartup | default false }}"
      restartPolicy: Always
