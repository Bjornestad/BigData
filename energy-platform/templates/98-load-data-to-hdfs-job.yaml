apiVersion: batch/v1
kind: Job
metadata:
  name: load-data-to-hdfs
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-namenode
          image: busybox:latest
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              echo "Waiting for NameNode..."
              until nc -z -v -w30 namenode 9000; do
                echo "Waiting for NameNode (namenode:9000)..."
                sleep 5
              done
              echo "NameNode is ready!"
        - name: wait-for-data
          image: busybox:latest
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              echo "Waiting for data files to be generated by fetch jobs..."

              # Wait for weather data (last year as proxy)
              echo "Waiting for /data/dmi_weather_2025.parquet..."
              until [ -f "/data/dmi_weather_2025.parquet" ]; do
                echo "  Weather data not found yet..."
                sleep 10
              done

              # Wait for energy data (single file)
              echo "Waiting for /data/historical_energy_ml.parquet..."
              until [ -f "/data/historical_energy_ml.parquet" ]; do
                echo "  Energy data not found yet..."
                sleep 10
              done

              echo "All required files found. Waiting 10s for safety..."
              sleep 10
          volumeMounts:
            - name: data-storage
              mountPath: /data
      containers:
      - name: hdfs-loader
        image: rtdl/hive-metastore:3.1.2
        securityContext:
          runAsUser: 0
        command:
          - /bin/bash
          - -c
          - |
            set -e

            export HADOOP_HOME=/opt/hadoop-3.3.1
            export PATH=$HADOOP_HOME/bin:$PATH

            echo "Configuring HDFS client..."
            cat > $HADOOP_HOME/etc/hadoop/core-site.xml <<'HDFS_CONFIG'
            <?xml version="1.0"?>
            <configuration>
              <property>
                <name>fs.defaultFS</name>
                <value>hdfs://namenode:9000</value>
              </property>
            </configuration>
            HDFS_CONFIG

            echo "Creating base HDFS directories..."
            hdfs dfs -mkdir -p /user/hive/warehouse/weather_wind_solar_area_hourly/historical
            hdfs dfs -mkdir -p /user/hive/warehouse/energy_by_municipality/historical
            hdfs dfs -mkdir -p /user/hive/warehouse/consumption_coverage_location/historical

            echo "Uploading Weather Parquet files..."
            for year in 2021 2022 2023 2024 2025; do
              WEATHER_FILE="/data/dmi_weather_${year}.parquet"
              if [ -f "$WEATHER_FILE" ]; then
                echo "Uploading $WEATHER_FILE..."
                hdfs dfs -put -f "$WEATHER_FILE" /user/hive/warehouse/weather_wind_solar_area_hourly/historical/
              else
                echo "Warning: $WEATHER_FILE not found."
              fi
            done

            echo "Uploading Energy Parquet file..."
            ENERGY_FILE="/data/historical_energy_ml.parquet"
            if [ -f "$ENERGY_FILE" ]; then
               echo "Uploading $ENERGY_FILE..."
               hdfs dfs -put -f "$ENERGY_FILE" /user/hive/warehouse/energy_by_municipality/historical/
               # Also upload to consumption location if needed, or just one place
               hdfs dfs -put -f "$ENERGY_FILE" /user/hive/warehouse/consumption_coverage_location/historical/
            else
               echo "Error: $ENERGY_FILE not found!"
               exit 1
            fi

            echo "HDFS upload process complete. Verifying files:"
            hdfs dfs -ls -R /user/hive/warehouse/

        volumeMounts:
        - name: data-storage
          mountPath: /data
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: weather-data-pvc
