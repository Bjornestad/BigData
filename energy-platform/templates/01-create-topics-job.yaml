apiVersion: batch/v1
kind: Job
metadata:
  name: create-topics-job
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: kafka-cli
          image: public.ecr.aws/bitnami/kafka:3.6.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Waiting for Kafka..."
              sleep 45
              echo "Creating topics..."
              kafka-topics.sh --create --if-not-exists --bootstrap-server energy-cluster-kafka:9092 --topic weather-live-ingest --partitions 3 --replication-factor 3
              kafka-topics.sh --create --if-not-exists --bootstrap-server energy-cluster-kafka:9092 --topic energy-predictions-output --partitions 3 --replication-factor 3
              echo "Topics created successfully."