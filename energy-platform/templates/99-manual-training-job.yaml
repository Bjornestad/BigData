apiVersion: batch/v1
kind: Job
metadata:
  name: manual-model-training
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: dummystad/bigdata:prediction-service-latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "Starting manual model training..."

            # Copy code from image to PVC if it doesn't exist or update it
            # We mount the PVC at /data to avoid hiding the image content at /app

            echo "Copying latest code to shared volume..."
            mkdir -p /data/SparkML
            cp -r /app/SparkML/* /data/SparkML/

            cd /data/SparkML

            # Ensure we can write to the models directory
            mkdir -p models

            # Run the training script
            python3 -u train_model.py

            echo "Training complete. Models saved to /data/SparkML/models"
            ls -la models/
        env:
        - name: SPARK_MASTER
          value: "local[*]"
        # Use FQDN to avoid DNS resolution issues in some containers
        - name: HIVE_METASTORE_URI
          value: "thrift://hive-metastore.{{ .Release.Namespace }}.svc.cluster.local:9083"
        - name: HADOOP_USER_NAME
          value: "root"
        # Enable mock data for testing if real data is missing
        # - name: USE_MOCK_DATA
        #   value: "true"
        # Mount the PVC at a different path so we don't shadow the /app directory in the image
        volumeMounts:
        - name: code
          mountPath: /data
      volumes:
      - name: code
        persistentVolumeClaim:
          claimName: weather-data-pvc
