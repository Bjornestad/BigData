apiVersion: batch/v1
kind: Job
metadata:
  name: replay-history
  namespace: {{ .Release.Namespace }}
spec:
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-namenode
          image: busybox:latest
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              echo "Waiting for NameNode..."
              until nc -z -v -w30 namenode 9000; do
                echo "Waiting for NameNode (namenode:9000)..."
                sleep 5
              done
              echo "NameNode is ready!"
      containers:
        - name: replayer
          image: dummystad/bigdata:fetcher-latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for Kafka..."
              until python -c "import socket; s=socket.socket(); s.settimeout(5); s.connect(('{{ .Release.Name }}-energy-cluster', 9092))" 2>/dev/null; do
                echo "Waiting for Kafka ({{ .Release.Name }}-energy-cluster:9092)..."
                sleep 5
              done
              echo "Kafka is ready!"

              echo "Waiting for Schema Registry..."
              until python3 -c "import socket; s=socket.socket(); s.settimeout(5); s.connect(('schema-registry', 8081))" 2>/dev/null; do
                echo "Waiting for Schema Registry..."
                sleep 5
              done
              echo "Schema Registry is ready!"

              echo "Starting replay from HDFS..."
              python3 /app/scripts/replay_to_kafka.py
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "{{ .Release.Name }}-energy-cluster:9092"
            - name: SCHEMA_REGISTRY_URL
              value: "http://schema-registry:8081"
          volumeMounts:
            - name: replay-script
              mountPath: /app/scripts/replay_to_kafka.py
              subPath: replay_to_kafka.py
            - name: data-volume
              mountPath: /data
      volumes:
        - name: replay-script
          configMap:
            name: replay-script
            defaultMode: 0755
        - name: data-volume
          persistentVolumeClaim:
            claimName: weather-data-pvc # Updated to match existing PVC