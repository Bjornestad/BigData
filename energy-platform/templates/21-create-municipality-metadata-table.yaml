apiVersion: batch/v1
kind: Job
metadata:
  name: create-municipality-metadata
  namespace: {{ .Release.Namespace }}
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: hdfs-copier
        image: rtdl/hive-metastore:3.1.2
        command:
          - /bin/bash
          - -c
          - |
            set -e

            export HADOOP_HOME=/opt/hadoop-3.3.1
            export PATH=$HADOOP_HOME/bin:$PATH

            echo "Waiting for NameNode to be ready..."
            sleep 60

            echo "Configuring HDFS client..."

            cat > $HADOOP_HOME/etc/hadoop/core-site.xml <<'HDFS_CONFIG'
            <?xml version="1.0"?>
            <configuration>
              <property>
                <name>fs.defaultFS</name>
                <value>hdfs://namenode:9000</value>
              </property>
            </configuration>
            HDFS_CONFIG

            echo "Creating HDFS directory..."
            hdfs dfs -mkdir -p /user/hive/warehouse/municipality_metadata

            echo "Uploading municipality metadata (99 Danish municipalities with DK areas)..."

            if [ -f /data/municipality_metadata.parquet ]; then
              hdfs dfs -put -f /data/municipality_metadata.parquet /user/hive/warehouse/municipality_metadata/
              echo "Upload complete"
            else
              echo "Warning: /data/municipality_metadata.parquet not found. Skipping upload."
            fi

            echo ""

            echo "Verification - Files in HDFS:"
            hdfs dfs -ls /user/hive/warehouse/municipality_metadata/ || true
            echo ""
            echo "Total size:"
            hdfs dfs -du -s -h /user/hive/warehouse/municipality_metadata/ || true

        volumeMounts:
        - name: data-storage
          mountPath: /data
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: weather-data-pvc
