apiVersion: batch/v1
kind: Job
metadata:
  name: setup-hdfs-sinks
  namespace: {{ .Release.Namespace }}
  # Hooks removed to prevent blocking install
spec:
  template:
    spec:
      containers:
      - name: setup
        image: curlimages/curl:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Setting up Kafka Connect HDFS sinks for real-time data..."

            CONNECT_URL="http://kafka-connect:8083"

            # Wait for Kafka Connect to be ready
            echo "Waiting for Kafka Connect..."
            until curl -s $CONNECT_URL/connectors > /dev/null 2>&1; do
              echo "  Kafka Connect not ready, waiting..."
              sleep 5
            done
            echo "✓ Kafka Connect is ready"

            # Delete existing connectors if they exist
            echo ""
            echo "Cleaning up old connectors..."
            for connector in hdfs-sink-weather-raw-avro hdfs-sink-energy-consumption-raw hdfs-sink-energy-predictions; do
              if curl -s $CONNECT_URL/connectors | grep -q "\"$connector\""; then
                echo "  Deleting $connector..."
                curl -X DELETE $CONNECT_URL/connectors/$connector
              fi
            done

            echo ""
            echo "================================================================"
            echo "CREATING HDFS SINK #1: weather_raw_avro (PARQUET)"
            echo "================================================================"

            # Note: hive.integration is FALSE because we create tables manually in create-historical-hive-tables job
            # This avoids dependency hell with HCatalog JARs in Kafka Connect
            curl -X POST $CONNECT_URL/connectors \
              -H "Content-Type: application/json" \
              -d '{
              "name": "hdfs-sink-weather-raw-avro",
              "config": {
                "connector.class": "io.confluent.connect.hdfs.HdfsSinkConnector",
                "topics.dir": "/user/hive/warehouse",
                "flush.size": "10000",
                "tasks.max": "3",
                "timezone": "UTC",
                "hive.database": "default",
                "rotate.interval.ms": "300000",
                "hive.partition.field.name": "year,month,day",
                "locale": "en-US",
                "logs.dir": "/tmp/logs",
                "format.class": "io.confluent.connect.hdfs.parquet.ParquetFormat",
                "parquet.codec": "snappy",
                "hive.integration": "false",
                "value.converter": "io.confluent.connect.avro.AvroConverter",
                "errors.log.enable": "true",
                "key.converter": "org.apache.kafka.connect.storage.StringConverter",
                "partition.duration.ms": "86400000",
                "schema.compatibility": "BACKWARD",
                "topics": "weather_raw_avro",
                "hdfs.url": "hdfs://namenode:9000",
                "value.converter.schema.registry.url": "http://schema-registry:8081",
                "consumer.override.auto.offset.reset": "latest",
                "partitioner.class": "io.confluent.connect.storage.partitioner.TimeBasedPartitioner",
                "name": "hdfs-sink-weather-raw-avro",
                "errors.tolerance": "all",
                "path.format": "'\''year'\''=YYYY/'\''month'\''=MM/'\''day'\''=dd",
                "timestamp.extractor": "Wallclock"
              }
            }'

            echo ""
            echo ""
            echo "================================================================"
            echo "CREATING HDFS SINK #2: energy_actual (PARQUET ONLY)"
            echo "================================================================"

            curl -X POST $CONNECT_URL/connectors \
              -H "Content-Type: application/json" \
              -d '{
              "name": "hdfs-sink-energy-consumption-raw",
              "config": {
                "connector.class": "io.confluent.connect.hdfs.HdfsSinkConnector",
                "tasks.max": "1",
                "topics": "energy_actual",
                "hdfs.url": "hdfs://namenode:9000",
                "flush.size": "10",
                "rotate.interval.ms": "3600000",
                "topics.dir": "/user/hive/warehouse/consumption_raw",
                "logs.dir": "/tmp/logs",
                "format.class": "io.confluent.connect.hdfs.parquet.ParquetFormat",
                "parquet.codec": "snappy",
                "partitioner.class": "io.confluent.connect.storage.partitioner.TimeBasedPartitioner",
                "path.format": "'\''year'\''=YYYY/'\''month'\''=MM",
                "partition.duration.ms": "2678400000",
                "locale": "en-US",
                "timezone": "UTC",
                "timestamp.extractor": "Wallclock",
                "hive.integration": "false",
                "schema.compatibility": "BACKWARD",
                "value.converter": "io.confluent.connect.avro.AvroConverter",
                "value.converter.schema.registry.url": "http://schema-registry:8081",
                "key.converter": "org.apache.kafka.connect.storage.StringConverter",
                "consumer.override.auto.offset.reset": "latest",
                "errors.tolerance": "all",
                "errors.log.enable": "true"
              }
            }'

            echo ""
            echo ""
            echo "================================================================"
            echo "CREATING HDFS SINK #3: energy_predictions (JSON)"
            echo "================================================================"

            curl -X POST $CONNECT_URL/connectors \
              -H "Content-Type: application/json" \
              -d '{
              "name": "hdfs-sink-energy-predictions",
              "config": {
                "connector.class": "io.confluent.connect.hdfs.HdfsSinkConnector",
                "tasks.max": "1",
                "topics": "energy_predictions",
                "hdfs.url": "hdfs://namenode:9000",
                "topics.dir": "/user/hive/warehouse/energy_predictions_realtime",
                "flush.size": "10",
                "rotate.interval.ms": "60000",
                "format.class": "io.confluent.connect.hdfs.json.JsonFormat",
                "partitioner.class": "io.confluent.connect.storage.partitioner.DefaultPartitioner",
                "schema.compatibility": "NONE",
                "value.converter": "org.apache.kafka.connect.json.JsonConverter",
                "value.converter.schemas.enable": "false",
                "key.converter": "org.apache.kafka.connect.storage.StringConverter"
              }
            }'

            echo ""
            echo ""
            echo "================================================================"
            echo "VERIFYING CONNECTORS"
            echo "================================================================"

            for connector in hdfs-sink-weather-raw-avro hdfs-sink-energy-consumption-raw hdfs-sink-energy-predictions; do
              echo "Waiting for connector $connector to be ready..."
              until curl -s "$CONNECT_URL/connectors/$connector/status" | grep -q '"state":"RUNNING"'; do
                echo "  Connector $connector not ready yet, waiting..."
                sleep 5
              done
              echo "✓ Connector $connector is ready"
            done

            echo ""
            echo "Active connectors:"
            curl -s $CONNECT_URL/connectors

            echo ""
            echo "✓ HDFS sinks configured successfully!"

      restartPolicy: Never
  backoffLimit: 2
