apiVersion: batch/v1
kind: Job
metadata:
  name: create-realtime-hive-tables
  namespace: {{ .Release.Namespace }}
spec:
  template:
    spec:
      securityContext:
        runAsUser: 0
      containers:
      - name: hive-setup
        image: public.ecr.aws/bitnami/spark:3.5
        env:
          - name: HOME
            value: "/tmp"
          - name: HADOOP_USER_NAME
            value: "root"
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e

            # Install netcat for the wait loop
            echo "Installing netcat..."
            apt-get update && apt-get install -y netcat-openbsd

            echo "Creating Hive external tables for real-time data..."

            # Wait for Hive Metastore
            echo "Waiting for Hive Metastore..."
            until nc -z hive-metastore 9083; do
              echo "  Hive Metastore (hive-metastore:9083) not ready, waiting..."
              sleep 10 # Increased wait time
            done
            echo "✓ Hive Metastore is ready"

            # Extra sleep to allow metastore to fully initialize internally
            echo "Giving metastore an extra 15 seconds to settle..."
            sleep 15

            echo "================================================================"

            # Create SQL script
            cat > /tmp/create_realtime_tables.sql << 'EOFHIVE'
            CREATE EXTERNAL TABLE IF NOT EXISTS weather_wind_solar_area_hourly_realtime (
              timestamp STRING, dk_area STRING, year INT, month INT, day INT, hour INT,
              month_of_year INT, hour_of_day INT, wind_speed_avg DOUBLE, wind_speed_max DOUBLE,
              wind_direction_sin DOUBLE, wind_direction_cos DOUBLE, solar_radiation_1h DOUBLE,
              sunshine_duration_1h DOUBLE, cloud_cover_avg DOUBLE, temperature_avg DOUBLE,
              humidity_avg DOUBLE, n_stations_wind INT, n_stations_solar INT
            ) STORED AS PARQUET LOCATION 'hdfs://namenode:9000/user/hive/warehouse/weather_wind_solar_area_hourly';

            CREATE EXTERNAL TABLE IF NOT EXISTS energy_actual_realtime (
              timestamp STRING, dk_area STRING, year INT, month INT, day INT, hour INT,
              total_production_mwh DOUBLE, total_consumption_mwh DOUBLE, net_balance_mwh DOUBLE,
              SolarMWh DOUBLE, OnshoreWindMWh DOUBLE, OffshoreWindLt100MW_MWh DOUBLE, OffshoreWindGe100MW_MWh DOUBLE
            ) STORED AS PARQUET LOCATION 'hdfs://namenode:9000/user/hive/warehouse/energy_actual_realtime';

            CREATE EXTERNAL TABLE IF NOT EXISTS energy_predictions_realtime_raw (
              timestamp STRING, dk_area STRING, year INT, month INT, day INT, hour INT,
              weather STRING, predictions STRING
            ) STORED AS PARQUET LOCATION 'hdfs://namenode:9000/user/hive/warehouse/energy_predictions_realtime';
            EOFHIVE

            # Execute via Spark SQL with retries
            echo "Executing Hive DDL via Spark..."

            ATTEMPTS=0
            MAX_ATTEMPTS=3
            SUCCESS=false
            until $SUCCESS || [ $ATTEMPTS -eq $MAX_ATTEMPTS ]; do
              ATTEMPTS=$((ATTEMPTS+1))
              echo "Attempt $ATTEMPTS of $MAX_ATTEMPTS..."
              if spark-sql \
                --master local[*] \
                --conf spark.driver.extraJavaOptions="-Duser.home=/tmp -Divy.home=/tmp/.ivy2 -Duser.name=root" \
                --conf spark.sql.warehouse.dir=hdfs://namenode:9000/user/hive/warehouse \
                --conf hive.metastore.uris=thrift://hive-metastore.{{ .Release.Namespace }}.svc.cluster.local:9083 \
                --conf spark.sql.catalogImplementation=hive \
                -f /tmp/create_realtime_tables.sql; then
                SUCCESS=true
                echo "✓ Spark SQL executed successfully."
              else
                echo "  ✗ Spark SQL failed. Retrying in 15 seconds..."
                sleep 15
              fi
            done

            if ! $SUCCESS; then
              echo "🔥 All attempts to run Spark SQL failed."
              exit 1
            fi

            echo ""
            echo "================================================================"
            echo "VERIFYING TABLES..."
            spark-sql \
              --master local[*] \
              --conf hive.metastore.uris=thrift://hive-metastore.{{ .Release.Namespace }}.svc.cluster.local:9083 \
              -e "SHOW TABLES;"

            echo "✓ Real-time Hive tables created successfully (PARQUET)!"
            echo "================================================================"

      restartPolicy: OnFailure
  backoffLimit: 4
