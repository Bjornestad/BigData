apiVersion: batch/v1
kind: Job
metadata:
  name: create-historical-hive-tables
  namespace: {{ .Release.Namespace }}
spec:
  template:
    spec:
      securityContext:
        runAsUser: 0
      containers:
      - name: hive-setup
        image: public.ecr.aws/bitnami/spark:3.5
        env:
          - name: HOME
            value: "/tmp"
          - name: HADOOP_USER_NAME
            value: "root"
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e

            # Install netcat for the wait loop
            echo "Installing netcat..."
            apt-get update && apt-get install -y netcat-openbsd

            echo "Creating Hive external tables for HISTORICAL data..."

            # Wait for Hive Metastore
            echo "Waiting for Hive Metastore..."
            until nc -z hive-metastore 9083; do
              echo "  Hive Metastore (hive-metastore:9083) not ready, waiting..."
              sleep 10
            done
            echo "✓ Hive Metastore is ready"

            # Extra sleep to allow metastore to fully initialize internally
            echo "Giving metastore an extra 15 seconds to settle..."
            sleep 15

            echo "================================================================"

            # Create SQL script
            cat > /tmp/create_historical_tables.sql << 'EOFHIVE'

            -- 1. Raw Weather Data (from fetch_year_worker -> load-data-to-hdfs)
            -- Location: /user/hive/warehouse/weather_wind_solar_area_hourly/historical
            CREATE EXTERNAL TABLE IF NOT EXISTS weather_raw_historical (
              station_id STRING,
              station_name STRING,
              parameter_id STRING,
              timestamp TIMESTAMP,
              value DOUBLE,
              longitude DOUBLE,
              latitude DOUBLE,
              date DATE,
              hour INT,
              year INT,
              month INT,
              day INT
            ) STORED AS PARQUET LOCATION 'hdfs://namenode:9000/user/hive/warehouse/weather_wind_solar_area_hourly/historical';

            -- 2. Raw Energy Data (from fetch_year_worker -> load-data-to-hdfs)
            -- Location: /user/hive/warehouse/energy_by_municipality/historical
            CREATE EXTERNAL TABLE IF NOT EXISTS energy_raw_historical (
              MunicipalityNo STRING,
              timestamp TIMESTAMP,
              ConsumptionMWh DOUBLE,
              ProductionGe100kW DOUBLE,
              ProductionLt100kW DOUBLE,
              SolarMWh DOUBLE,
              OnshoreWindMWh DOUBLE,
              OffshoreWindLt100MW_MWh DOUBLE,
              OffshoreWindGe100MW_MWh DOUBLE,
              ThermalPowerMWh DOUBLE,
              date DATE,
              hour INT,
              year INT,
              month INT,
              day INT
            ) STORED AS PARQUET LOCATION 'hdfs://namenode:9000/user/hive/warehouse/energy_by_municipality/historical';

            -- 3. Aggregated Views (to match what ML script expects)

            -- View for Weather Aggregation (weather_area_hourly_historical)
            -- Aggregates raw station data to DK area level
            CREATE VIEW IF NOT EXISTS weather_area_hourly_historical AS
            SELECT
              CASE
                WHEN station_id IN ('06186', '06180', '06190', '06135', '06138', '06141', '06151', '06156', '06159', '06168', '06169', '06170', '06181', '06183', '06187', '06188', '06193') THEN 'DK2'
                ELSE 'DK1'
              END as dk_area,
              year, month, day, hour,
              AVG(CASE WHEN parameter_id = 'temp_dry' THEN value END) as temp_mean_area,
              MAX(CASE WHEN parameter_id = 'temp_dry' THEN value END) as temp_max_area,
              MIN(CASE WHEN parameter_id = 'temp_dry' THEN value END) as temp_min_area,
              AVG(CASE WHEN parameter_id = 'wind_speed' THEN value END) as wind_speed_mean_area,
              MAX(CASE WHEN parameter_id = 'wind_max' THEN value END) as wind_speed_max_area,
              AVG(CASE WHEN parameter_id = 'humidity' THEN value END) as humidity_mean_area,
              AVG(CASE WHEN parameter_id = 'pressure' THEN value END) as pressure_at_sea_mean_area,
              AVG(CASE WHEN parameter_id = 'cloud_cover' THEN value END) as cloud_cover_mean_area,
              AVG(CASE WHEN parameter_id = 'visibility' THEN value END) as visibility_mean_area,
              -- Placeholders for fields not in raw data but expected by ML script
              CAST(NULL AS DOUBLE) as temp_grass_mean_area,
              CAST(NULL AS DOUBLE) as temp_soil_mean_area,
              CAST(NULL AS DOUBLE) as wind_dir_sin_area,
              CAST(NULL AS DOUBLE) as wind_dir_cos_area,
              CAST(NULL AS DOUBLE) as wind_gust_always_past1h_max_area,
              CAST(NULL AS DOUBLE) as radia_glob_past1h_area,
              CAST(NULL AS DOUBLE) as sun_last1h_glob_area,
              CAST(NULL AS DOUBLE) as sun_last10min_glob_area,
              CAST(NULL AS DOUBLE) as precip_past1h_mean_area,
              CAST(NULL AS DOUBLE) as precip_past10min_mean_area,
              COUNT(DISTINCT station_id) as n_stations
            FROM weather_raw_historical
            GROUP BY
              CASE
                WHEN station_id IN ('06186', '06180', '06190', '06135', '06138', '06141', '06151', '06156', '06159', '06168', '06169', '06170', '06181', '06183', '06187', '06188', '06193') THEN 'DK2'
                ELSE 'DK1'
              END,
              year, month, day, hour;

            -- View for Energy Aggregation (consumption_area_hourly)
            -- Aggregates raw municipality data to DK area level
            CREATE VIEW IF NOT EXISTS consumption_area_hourly AS
            SELECT
              CASE
                WHEN CAST(MunicipalityNo AS INT) < 400 THEN 'DK1'
                ELSE 'DK2'
              END as dk_area,
              year, month, day, hour,
              SUM(ConsumptionMWh) as consumption_mwh_area
            FROM energy_raw_historical
            GROUP BY
              CASE
                WHEN CAST(MunicipalityNo AS INT) < 400 THEN 'DK1'
                ELSE 'DK2'
              END,
              year, month, day, hour;

            -- Create table for tracking predictions (used by prediction service)
            CREATE TABLE IF NOT EXISTS predicted_buckets (
              dk_area STRING,
              year INT,
              month INT,
              day INT,
              hour INT,
              minute_bucket INT,
              predicted_at TIMESTAMP
            ) STORED AS PARQUET;

            -- Create table for 10-min weather aggregation (used by prediction service)
            CREATE TABLE IF NOT EXISTS weather_area_10min (
              dk_area STRING,
              day INT,
              hour INT,
              minute_bucket INT,
              temp_mean_area DOUBLE,
              temp_max_area DOUBLE,
              temp_min_area DOUBLE,
              wind_speed_mean_area DOUBLE,
              wind_speed_max_area DOUBLE,
              wind_dir_sin_area DOUBLE,
              wind_dir_cos_area DOUBLE,
              sun_last10min_glob_area DOUBLE,
              precip_past10min_mean_area DOUBLE,
              humidity_mean_area DOUBLE,
              pressure_at_sea_mean_area DOUBLE,
              cloud_cover_mean_area DOUBLE,
              visibility_mean_area DOUBLE,
              n_stations INT,
              predicted INT,
              year INT,
              month INT
            ) STORED AS PARQUET;

            EOFHIVE

            # Execute via Spark SQL with retries
            echo "Executing Hive DDL via Spark..."

            ATTEMPTS=0
            MAX_ATTEMPTS=3
            SUCCESS=false
            until $SUCCESS || [ $ATTEMPTS -eq $MAX_ATTEMPTS ]; do
              ATTEMPTS=$((ATTEMPTS+1))
              echo "Attempt $ATTEMPTS of $MAX_ATTEMPTS..."
              if spark-sql \
                --master local[*] \
                --conf spark.driver.extraJavaOptions="-Duser.home=/tmp -Divy.home=/tmp/.ivy2 -Duser.name=root" \
                --conf spark.sql.warehouse.dir=hdfs://namenode:9000/user/hive/warehouse \
                --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore.{{ .Release.Namespace }}.svc.cluster.local:9083 \
                --conf spark.sql.catalogImplementation=hive \
                -f /tmp/create_historical_tables.sql; then
                SUCCESS=true
                echo "✓ Spark SQL executed successfully."
              else
                echo "  ✗ Spark SQL failed. Retrying in 15 seconds..."
                sleep 15
              fi
            done

            if ! $SUCCESS; then
              echo "🔥 All attempts to run Spark SQL failed."
              exit 1
            fi

            echo ""
            echo "================================================================"
            echo "VERIFYING TABLES..."
            spark-sql \
              --master local[*] \
              --conf spark.hadoop.hive.metastore.uris=thrift://hive-metastore.{{ .Release.Namespace }}.svc.cluster.local:9083 \
              -e "SHOW TABLES;"

            echo "✓ Historical Hive tables created successfully!"
            echo "================================================================"

      restartPolicy: OnFailure
  backoffLimit: 4
