apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-energy-actual-fetcher
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realtime-energy-actual-fetcher
  template:
    metadata:
      labels:
        app: realtime-energy-actual-fetcher
    spec:
      containers:
      - name: fetcher
        image: dummystad/bigdata:fetcher-latest
        imagePullPolicy: Always
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "Starting actual energy data fetcher..."
            python3 /app/scripts/fetch_realtime_energy.py
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "{{ .Release.Name }}-energy-cluster:9092"
        - name: KAFKA_TOPIC
          value: "energy_actual"
        - name: FETCH_INTERVAL
          value: "3600"  # 1 hour (energy data is timestamped hourly)
      restartPolicy: Always
