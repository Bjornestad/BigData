apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-config
data:
  weather_station.avsc: |
    {
      "type": "record",
      "name": "WeatherObservation",
      "namespace": "dk.weather",
      "fields": [
        { "name": "stationId", "type": ["null", "string"], "default": null },
        { "name": "timeObserved", "type": ["null", "string"], "default": null },
        { "name": "parameterId", "type": ["null", "string"], "default": null },
        { "name": "value", "type": ["null", "double"], "default": null }
      ]
    }
  energy_prediction.avsc: |
    {
      "type": "record",
      "name": "EnergyPrediction",
      "namespace": "com.energyproject",
      "fields": [
        { "name": "station_id", "type": "string" },
        { "name": "timestamp", "type": "string", "doc": "ISO8601 prediction target time" },
        { "name": "predicted_production_mwh", "type": "double" },
        { "name": "model_version", "type": "string", "default": "v1.0" },
        { "name": "confidence_score", "type": ["null", "double"], "default": null }
      ]
    }
  energy_consumption.avsc: |
    {
      "type": "record",
      "name": "EnergyConsumptionRaw",
      "namespace": "dk.energy",
      "fields": [
        {"name": "HourUTC", "type": "string"},
        {"name": "HourDK", "type": "string"},
        {"name": "PriceArea", "type": "string"},
        {"name": "ConnectedArea", "type": "string"},
        {"name": "ViaArea", "type": "string"},
        {"name": "SharePPM", "type": ["null", "long"], "default": null},
        {"name": "ShareMWh", "type": ["null", "double"], "default": null},
        {"name": "Updated", "type": "string"}
      ]
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: register-schemas-job
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: curl-client
          image: curlimages/curl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for Schema Registry..."
              while [ $(curl -s -o /dev/null -w %{http_code} http://schema-registry:8081) -ne 200 ]; do sleep 5; done
              
              echo "1. Registering Weather Input Schema..."
              SCHEMA_JSON=$(cat /config/weather_station.avsc | sed 's/"/\\"/g' | tr -d '\n' | tr -d ' ')
              curl -X POST -H "Content-Type: application/vnd.schemaregistry.v1+json" \
                   --data "{\"schema\": \"$SCHEMA_JSON\"}" \
                   http://schema-registry:8081/subjects/weather_raw_avro-value/versions
              
              echo "\n2. Registering Energy Prediction Output Schema..."
              SCHEMA_JSON_PRED=$(cat /config/energy_prediction.avsc | sed 's/"/\\"/g' | tr -d '\n' | tr -d ' ')
              curl -X POST -H "Content-Type: application/vnd.schemaregistry.v1+json" \
                   --data "{\"schema\": \"$SCHEMA_JSON_PRED\"}" \
                   http://schema-registry:8081/subjects/energy_predictions-value/versions

              echo "\n3. Registering Energy Actual Schema..."
              SCHEMA_JSON_ACTUAL=$(cat /config/energy_consumption.avsc | sed 's/"/\\"/g' | tr -d '\n' | tr -d ' ')
              curl -X POST -H "Content-Type: application/vnd.schemaregistry.v1+json" \
                   --data "{\"schema\": \"$SCHEMA_JSON_ACTUAL\"}" \
                   http://schema-registry:8081/subjects/energy_actual-value/versions
              
              echo "\nDone."
          volumeMounts:
            - name: schema-volume
              mountPath: /config
      volumes:
        - name: schema-volume
          configMap:
            name: schema-config