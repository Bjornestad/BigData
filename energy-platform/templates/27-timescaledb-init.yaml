apiVersion: v1
kind: ConfigMap
metadata:
  name: timescaledb-init
  namespace: {{ .Release.Namespace }}
data:
  01-init-schema.sql: |
    -- Create TimescaleDB extension
    CREATE EXTENSION IF NOT EXISTS timescaledb;

    -- Create measurements table
    CREATE TABLE IF NOT EXISTS measurements (
      time        TIMESTAMPTZ NOT NULL,
      value       DOUBLE PRECISION NOT NULL,
      type        TEXT NOT NULL,
      metadata    JSONB DEFAULT '{}',
      UNIQUE(time, type)  -- Required for ON CONFLICT in database writer
    );

    -- Convert to hypertable
    SELECT create_hypertable('measurements', 'time', if_not_exists => TRUE);

    -- Create indexes for faster queries
    CREATE INDEX IF NOT EXISTS idx_measurements_type_time ON measurements (type, time DESC);
    CREATE INDEX IF NOT EXISTS idx_measurements_time ON measurements (time DESC);

    -- Enable compression
    ALTER TABLE measurements SET (
      timescaledb.compress,
      timescaledb.compress_segmentby = 'type',
      timescaledb.compress_orderby = 'time DESC'
    );

    -- Add compression policy (compress data older than 7 days)
    SELECT add_compression_policy('measurements', INTERVAL '7 days', if_not_exists => TRUE);

    -- Add retention policy (delete data older than 1 year)
    SELECT add_retention_policy('measurements', INTERVAL '1 year', if_not_exists => TRUE);

    -- Create continuous aggregate for 5-minute intervals
    CREATE MATERIALIZED VIEW IF NOT EXISTS measurements_5min
    WITH (timescaledb.continuous) AS
    SELECT
      time_bucket('5 minutes', time) AS bucket,
      type,
      AVG(value) as avg_value,
      MIN(value) as min_value,
      MAX(value) as max_value,
      COUNT(*) as count
    FROM measurements
    GROUP BY bucket, type;

    -- Create continuous aggregate for hourly intervals
    CREATE MATERIALIZED VIEW IF NOT EXISTS measurements_1hour
    WITH (timescaledb.continuous) AS
    SELECT
      time_bucket('1 hour', time) AS bucket,
      type,
      AVG(value) as avg_value,
      MIN(value) as min_value,
      MAX(value) as max_value,
      COUNT(*) as count
    FROM measurements
    GROUP BY bucket, type;

    -- Create continuous aggregate for daily intervals
    CREATE MATERIALIZED VIEW IF NOT EXISTS measurements_1day
    WITH (timescaledb.continuous) AS
    SELECT
      time_bucket('1 day', time) AS bucket,
      type,
      AVG(value) as avg_value,
      MIN(value) as min_value,
      MAX(value) as max_value,
      COUNT(*) as count
    FROM measurements
    GROUP BY bucket, type;

    -- Add refresh policy for 5-minute aggregate
    SELECT add_continuous_aggregate_policy('measurements_5min',
      start_offset => INTERVAL '1 hour',
      end_offset => INTERVAL '5 minutes',
      schedule_interval => INTERVAL '5 minutes',
      if_not_exists => TRUE);

    -- Add refresh policy for hourly aggregate
    SELECT add_continuous_aggregate_policy('measurements_1hour',
      start_offset => INTERVAL '3 hours',
      end_offset => INTERVAL '1 hour',
      schedule_interval => INTERVAL '10 minutes',
      if_not_exists => TRUE);

    -- Add refresh policy for daily aggregate
    SELECT add_continuous_aggregate_policy('measurements_1day',
      start_offset => INTERVAL '3 days',
      end_offset => INTERVAL '1 day',
      schedule_interval => INTERVAL '1 hour',
      if_not_exists => TRUE);

    -- Grant permissions (if needed for specific user)
    -- GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO your_app_user;

    -- Create indexes on materialized views
    CREATE INDEX IF NOT EXISTS idx_measurements_5min_type_bucket ON measurements_5min (type, bucket DESC);
    CREATE INDEX IF NOT EXISTS idx_measurements_1hour_type_bucket ON measurements_1hour (type, bucket DESC);
    CREATE INDEX IF NOT EXISTS idx_measurements_1day_type_bucket ON measurements_1day (type, bucket DESC);
