---
# Job 1: Fetch 2021 historical data
apiVersion: batch/v1
kind: Job
metadata:
  name: fetch-historical-2021
  namespace: bd-bd-gr-08
spec:
  activeDeadlineSeconds: 7200
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: fetch-historical
        year: "2021"
    spec:
      restartPolicy: Never
      containers:
      - name: fetcher
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e

            # Install dependencies
            apt-get update -qq && apt-get install -y -qq default-jre-headless wget

            # Install Hadoop client
            wget -q https://dlcdn.apache.org/hadoop/common/hadoop-3.3.6/hadoop-3.3.6.tar.gz
            tar -xzf hadoop-3.3.6.tar.gz -C /opt/
            export HADOOP_HOME=/opt/hadoop-3.3.6
            export PATH=$PATH:$HADOOP_HOME/bin
            export JAVA_HOME=$(readlink -f /usr/bin/java | sed "s:/bin/java::")

            # Install Python packages
            pip install -q --no-cache-dir requests pandas numpy pyarrow python-dateutil python-dotenv

            cd /app/scripts

            echo "===== FETCHING 2021 DATA ====="
            python3 fetch_historical_weather.py --start-date "2021-01-01" --end-date "2021-12-31"
            sleep 30
            python3 fetch_historical_energy.py --start-date "2021-01-01" --end-date "2021-12-31"
            echo "✓ 2021 complete"
        env:
        - name: DMI_API_KEY
          value: "b5800a05-4f0f-4584-b130-6129213728c0"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-bootstrap:9092"
        - name: SCHEMA_REGISTRY_URL
          value: "http://kafka-schema-registry:8081"
        - name: WEATHER_KAFKA_TOPIC
          value: "weather_raw_avro"
        - name: ENERGY_KAFKA_TOPIC
          value: "energy_actual"
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        persistentVolumeClaim:
          claimName: weather-data-pvc

