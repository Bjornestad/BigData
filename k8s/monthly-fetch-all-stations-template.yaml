apiVersion: batch/v1
kind: Job
metadata:
  name: fetch-all-YYYY-MM
  namespace: bd-bd-gr-08
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: fetch-all-stations
        image: python:3.10-slim
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        env:
        - name: START_DATE
          value: "YYYY-MM-01"
        - name: END_DATE
          value: "YYYY-MM-DD"
        - name: API_KEY
          valueFrom:
            configMapKeyRef:
              name: dmi-api-config
              key: API_KEY
        command:
          - /bin/bash
          - -c
          - |
            pip install -q requests pandas pyarrow tqdm

            python3 -u <<'PYTHON'
            import os, sys, requests, pandas as pd
            from datetime import datetime
            import time
            from tqdm import tqdm

            START_DATE = os.getenv('START_DATE')
            END_DATE = os.getenv('END_DATE')
            API_KEY = os.getenv('API_KEY')

            print(f"🌤️  Fetching ALL Danish Weather Stations: {START_DATE} to {END_DATE}", flush=True)
            print(f"📋 Range: Stations 05005-06197 (SYNOP + PLUVIO)", flush=True)
            print(f"📊 Strategy: Maximum data collection", flush=True)
            sys.stdout.flush()

            # EXISTING 61 SYNOP stations already in HDFS - EXCLUDE these to avoid duplicates
            EXISTING_STATIONS = {
                "06019", "06030", "06031", "06032", "06034", "06041", "06049", "06051", "06052",
                "06056", "06058", "06060", "06065", "06068", "06069", "06070", "06072", "06073",
                "06074", "06079", "06080", "06081", "06082", "06088", "06093", "06096", "06102",
                "06104", "06108", "06109", "06110", "06116", "06118", "06119", "06120", "06123",
                "06124", "06126", "06132", "06135", "06138", "06141", "06149", "06151", "06156",
                "06159", "06168", "06169", "06170", "06180", "06181", "06183", "06186", "06187",
                "06188", "06190", "06193"
            }

            # Generate all station IDs from 05005 to 06197 (continuous range)
            # EXCLUDE existing stations to avoid duplicates
            ALL_STATIONS = []
            for station_num in range(5005, 6198):  # 5005 to 6197 inclusive
                station_id = f"{station_num:05d}"  # Format as 5-digit string with leading zeros
                if station_id not in EXISTING_STATIONS:
                    ALL_STATIONS.append(station_id)

            print(f"\n📍 Total stations to query: {len(ALL_STATIONS)}", flush=True)
            print(f"   Range: {ALL_STATIONS[0]} to {ALL_STATIONS[-1]}", flush=True)
            print(f"   Excluding: {len(EXISTING_STATIONS)} existing stations (already in HDFS)", flush=True)
            print(f"   New stations: {len(ALL_STATIONS)}", flush=True)
            sys.stdout.flush()

            # FETCH STATION NAMES FROM DMI API
            print(f"\n📡 Fetching station names from DMI API...", flush=True)
            sys.stdout.flush()

            stations_url = "https://dmigw.govcloud.dk/v2/metObs/collections/station/items"
            params = {'api-key': API_KEY, 'limit': 2000}

            try:
                response = requests.get(stations_url, params=params, timeout=60)
                if response.status_code == 200:
                    data = response.json()
                    features = data.get('features', [])

                    # Create mapping - only Danish stations (05xxx and 06xxx)
                    STATION_NAMES = {}
                    for feature in features:
                        props = feature.get('properties', {})
                        station_id = props.get('stationId')
                        station_name = props.get('name')

                        if station_id and isinstance(station_id, str):
                            # Only include Danish SYNOP/PLUVIO stations
                            if (station_id.startswith('05') or station_id.startswith('06')) and len(station_id) == 5:
                                STATION_NAMES[station_id] = station_name if station_name else station_id

                    print(f"✓ Loaded {len(STATION_NAMES)} Danish station names", flush=True)
                else:
                    print(f"⚠️  Failed to fetch station names, will use station IDs", flush=True)
                    STATION_NAMES = {}
            except Exception as e:
                print(f"⚠️  Error fetching station names: {e}, will use station IDs", flush=True)
                STATION_NAMES = {}

            sys.stdout.flush()

            def fetch_weather_data(station_id, start_date, end_date):
                """Fetch data for a single station"""
                url = "https://dmigw.govcloud.dk/v2/metObs/collections/observation/items"
                params = {
                    'api-key': API_KEY,
                    'stationId': station_id,
                    'datetime': f'{start_date}T00:00:00Z/{end_date}T23:59:59Z',
                    'limit': 300000
                }
                try:
                    response = requests.get(url, params=params, timeout=90)
                    if response.status_code == 200:
                        return response.json().get('features', [])
                    elif response.status_code == 404:
                        # Station doesn't exist or has no data - this is normal
                        return []
                    else:
                        return []
                except requests.exceptions.Timeout:
                    print(f"  ⏱️  Timeout for {station_id}, retrying...", flush=True)
                    time.sleep(2)
                    try:
                        response = requests.get(url, params=params, timeout=120)
                        if response.status_code == 200:
                            return response.json().get('features', [])
                    except:
                        pass
                    return []
                except Exception as e:
                    # Silently skip errors - many station IDs won't exist
                    return []

            # STEP 1: Fetch weather data from ALL stations
            print(f"\n{'='*60}", flush=True)
            print(f"Fetching data from {len(ALL_STATIONS)} potential stations", flush=True)
            print(f"{'='*60}", flush=True)
            sys.stdout.flush()

            all_records = []
            stations_with_data = []
            total_observations_by_station = {}

            with tqdm(total=len(ALL_STATIONS), desc="Scanning stations") as pbar:
                for idx, station_id in enumerate(ALL_STATIONS, 1):
                    features = fetch_weather_data(station_id, START_DATE, END_DATE)

                    if features:
                        stations_with_data.append(station_id)
                        station_obs_count = 0

                        for feature in features:
                            props = feature.get('properties', {})
                            geom = feature.get('geometry', {}).get('coordinates', [None, None])

                            all_records.append({
                                'station_id': station_id,
                                'station_name': props.get('stationName', station_id),
                                'timestamp': props.get('observed'),
                                'parameter_id': props.get('parameterId'),
                                'value': props.get('value'),
                                'latitude': geom[1],
                                'longitude': geom[0]
                            })
                            station_obs_count += 1

                        total_observations_by_station[station_id] = station_obs_count
                        pbar.set_postfix({
                            'active': len(stations_with_data),
                            'obs': f"{len(all_records):,}"
                        })

                    pbar.update(1)

                    # Rate limiting
                    if idx % 50 == 0:
                        time.sleep(1)
                    else:
                        time.sleep(0.1)

            print(f"\n{'='*60}", flush=True)
            print(f"✓ Scan complete!", flush=True)
            print(f"  Stations with data: {len(stations_with_data)}/{len(ALL_STATIONS)}", flush=True)
            print(f"  Total observations: {len(all_records):,}", flush=True)
            print(f"{'='*60}", flush=True)
            sys.stdout.flush()

            # Print top 20 stations by observation count
            if total_observations_by_station:
                print(f"\nTop 20 stations by observation count:", flush=True)
                sorted_stations = sorted(total_observations_by_station.items(),
                                        key=lambda x: x[1], reverse=True)[:20]
                for station_id, count in sorted_stations:
                    print(f"  {station_id}: {count:>8,} observations", flush=True)
                sys.stdout.flush()

            if not all_records:
                print(f"\n⚠️  No data found for any station in this period", flush=True)
                sys.exit(0)

            # STEP 2: Save RAW long-format data
            print(f"\n{'='*60}", flush=True)
            print(f"Saving RAW long-format data to PVC", flush=True)
            print(f"{'='*60}", flush=True)
            sys.stdout.flush()

            df = pd.DataFrame(all_records)

            # Parse timestamp and add date columns
            df['timestamp'] = pd.to_datetime(df['timestamp'])
            df['year'] = df['timestamp'].dt.year
            df['month'] = df['timestamp'].dt.month
            df['day'] = df['timestamp'].dt.day
            df['hour'] = df['timestamp'].dt.hour
            df['minute'] = df['timestamp'].dt.minute

            # Keep timestamp as string for Hive compatibility
            df['ts'] = df['timestamp'].astype(str)
            df = df.drop('timestamp', axis=1)

            # Reorder columns
            df = df[['station_id', 'station_name', 'ts', 'parameter_id', 'value',
                    'latitude', 'longitude', 'year', 'month', 'day', 'hour', 'minute']]

            os.makedirs('/data/weather_all_stations', exist_ok=True)
            filename = f"/data/weather_all_stations/weather_{START_DATE[:7].replace('-', '')}.parquet"

            df.to_parquet(filename, engine='pyarrow', compression='snappy', index=False)

            file_size_mb = os.path.getsize(filename) / 1024 / 1024

            print(f"✅ Saved to: {filename}", flush=True)
            print(f"   Observations: {len(df):,}", flush=True)
            print(f"   Stations: {len(stations_with_data)}", flush=True)
            print(f"   File size: {file_size_mb:.2f} MB", flush=True)
            print(f"   Columns: {list(df.columns)}", flush=True)
            sys.stdout.flush()

            # Save station list for reference
            stations_file = f"/data/weather_all_stations/stations_{START_DATE[:7].replace('-', '')}.txt"
            with open(stations_file, 'w') as f:
                f.write(f"Stations with data for {START_DATE} to {END_DATE}\n")
                f.write(f"Total: {len(stations_with_data)}\n\n")
                for station_id in sorted(stations_with_data):
                    obs_count = total_observations_by_station.get(station_id, 0)
                    f.write(f"{station_id}: {obs_count:,} observations\n")

            print(f"📋 Station list saved to: {stations_file}", flush=True)
            print(f"\n🎉 Job complete!", flush=True)
            sys.stdout.flush()

            PYTHON
        volumeMounts:
        - name: data-storage
          mountPath: /data
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: weather-data-pvc
