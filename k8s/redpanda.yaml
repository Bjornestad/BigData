apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-config
  namespace: bd-bd-gr-08
data:
  # IMPORTANT: use your bootstrap service (and namespace-safe DNS)
  KAFKA_BROKERS: "kafka-bootstrap.bd-bd-gr-08.svc.cluster.local:9092"

  # If you're not using schema registry in Console, keep it disabled
  KAFKA_SCHEMAREGISTRY_ENABLED: "false"
  KAFKA_SCHEMAREGISTRY_URLS: "http://kafka-schema-registry.bd-bd-gr-08.svc.cluster.local:8081"

  CONNECT_ENABLED: "true"
  CONNECT_CLUSTERS_NAME: "Connectors"
  CONNECT_CLUSTERS_URL: "http://kafka-connect.bd-bd-gr-08.svc.cluster.local:8083"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: bd-bd-gr-08
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: redpandadata/console:v2.7.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: redpanda-config
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: bd-bd-gr-08
spec:
  selector:
    app: redpanda
  ports:
    - name: web
      protocol: TCP
      port: 8081
      targetPort: 8080
