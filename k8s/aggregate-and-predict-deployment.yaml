apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregate-and-predict-service
  namespace: bd-bd-gr-08
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aggregate-and-predict
  template:
    metadata:
      labels:
        app: aggregate-and-predict
    spec:
      serviceAccountName: pipeline-waiter

      initContainers:
      - name: wait-for-pipeline
        image: bitnami/kubectl:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            ns="bd-bd-gr-08"

            echo "============================================================"
            echo "PIPELINE ORCHESTRATION - SEQUENTIAL JOB EXECUTION"
            echo "============================================================"
            echo ""

            # Step 1: Start and wait for historical fetch jobs (5 parallel jobs for 2021-2025)
            echo "Step 1/4: Starting historical data fetch jobs..."

            # Delete old fetch jobs if they exist and are incomplete
            for year in 2021 2022 2023 2024 2025; do
              if kubectl get job fetch-historical-$year -n $ns &>/dev/null; then
                status=$(kubectl get job fetch-historical-$year -n $ns -o jsonpath='{.status.succeeded}')
                if [ "$status" != "1" ]; then
                  echo "  Deleting incomplete fetch job for $year..."
                  kubectl delete job fetch-historical-$year -n $ns --ignore-not-found=true
                fi
              fi
            done
            sleep 5

            # Create all historical fetch jobs (they run in parallel)
            echo "  Creating historical fetch jobs (2021-2025)..."
            kubectl apply -f /config/fetch-historical-data-jobs.yaml

            # Wait for all fetch jobs to complete in parallel
            echo "  Waiting for historical data fetch to complete (this may take a while)..."
            kubectl wait -n $ns --for=condition=complete job/fetch-historical-2021 --timeout=7200s &
            kubectl wait -n $ns --for=condition=complete job/fetch-historical-2022 --timeout=7200s &
            kubectl wait -n $ns --for=condition=complete job/fetch-historical-2023 --timeout=7200s &
            kubectl wait -n $ns --for=condition=complete job/fetch-historical-2024 --timeout=7200s &
            kubectl wait -n $ns --for=condition=complete job/fetch-historical-2025 --timeout=7200s &
            wait
            echo "  ✓ Historical data fetch completed (all years: 2021-2025)"
            echo ""

            # Step 2: Wait for weather hourly table (blocks until complete)
            echo "Step 2/4: Waiting for weather_area_hourly table..."
            kubectl wait -n $ns --for=condition=complete job/create-weather-hourly-table --timeout=7200s
            echo "✓ Weather hourly table created"
            echo ""

            # Step 3: Only AFTER weather table is ready, start model training
            echo "Step 3/4: Starting model training job..."
            # Delete old training job if it exists and is not complete
            if kubectl get job train-ml-model -n $ns &>/dev/null; then
              status=$(kubectl get job train-ml-model -n $ns -o jsonpath='{.status.succeeded}')
              if [ "$status" != "1" ]; then
                echo "  Deleting incomplete/old training job..."
                kubectl delete job train-ml-model -n $ns --ignore-not-found=true
                sleep 5
              fi
            fi

            # Create training job if it doesn't exist
            if ! kubectl get job train-ml-model -n $ns &>/dev/null; then
              echo "  Creating training job..."
              kubectl apply -f /config/train-model-job.yaml
            fi

            echo "  Waiting for model training to complete..."
            kubectl wait -n $ns --for=condition=complete job/train-ml-model --timeout=7200s
            echo "✓ Model training completed"
            echo ""

            # Step 4: Start realtime fetcher deployment
            echo "Step 4/4: Starting realtime data fetcher..."
            # Delete old fetcher if it exists
            if kubectl get deployment realtime-fetcher -n $ns &>/dev/null; then
              echo "  Deleting old realtime-fetcher deployment..."
              kubectl delete deployment realtime-fetcher -n $ns --ignore-not-found=true
              sleep 5
            fi

            echo "  Creating realtime-fetcher deployment..."
            kubectl apply -f /config/realtime-fetcher.yaml
            echo "✓ Realtime fetcher started"
            echo ""

            echo "============================================================"
            echo "✓ ALL PREREQUISITES COMPLETED - STARTING SERVICE"
            echo "============================================================"
        volumeMounts:
        - name: job-configs
          mountPath: /config

      containers:
      - name: service
        image: eclipse-temurin:17-jre
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            apt-get update -qq && apt-get install -y -qq python3 python3-pip > /dev/null 2>&1
            pip3 install -q --no-cache-dir --break-system-packages pyspark==4.1.0 kafka-python pandas numpy
            cd /app/SparkML
            python3 -u aggregate_and_predict_service.py
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-bootstrap:9092"
        - name: OUTPUT_TOPIC
          value: "energy_predictions"
        - name: CONSUMPTION_MODEL_PATH
          value: "hdfs://namenode:9000/user/hive/warehouse/models"
        - name: CHECK_INTERVAL
          value: "600"
        - name: JAVA_HOME
          value: "/opt/java/openjdk"
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        persistentVolumeClaim:
          claimName: weather-data-pvc
      - name: job-configs
        configMap:
          name: pipeline-job-configs
      restartPolicy: Always
