apiVersion: batch/v1
kind: Job
metadata:
  name: create-ml-training-table-v2
  namespace: bd-bd-gr-08
spec:
  template:
    spec:
      containers:
      - name: hive-client
        image: apache/hive:4.0.0
        command:
          - /bin/bash
          - -c
          - |
            set -e
            echo "Creating ML training dataset table (v2 - step by step)..."

            beeline -u jdbc:hive2://hiveserver2:10000 <<'EOF'

            -- Drop existing table if it exists
            DROP TABLE IF EXISTS ml_training_data;

            -- Create table structure only
            CREATE TABLE ml_training_data (
              year INT,
              month INT,
              day INT,
              hour INT,
              dk_area STRING,
              month_of_year INT,
              hour_of_day INT,
              wind_speed_avg DOUBLE,
              wind_speed_max DOUBLE,
              wind_direction_sin DOUBLE,
              wind_direction_cos DOUBLE,
              solar_radiation_1h DOUBLE,
              sunshine_duration_1h DOUBLE,
              cloud_cover_avg DOUBLE,
              n_stations_wind INT,
              n_stations_solar INT,
              total_production_mwh DOUBLE,
              total_consumption_mwh DOUBLE
            )
            STORED AS PARQUET;

            SELECT 'Table structure created successfully!' as status;

            EOF

            echo "Now inserting data into table..."

            beeline -u jdbc:hive2://hiveserver2:10000 <<'EOF'

            -- Insert data from query
            INSERT INTO TABLE ml_training_data
            SELECT
              w.year,
              w.month,
              w.day,
              w.hour,
              w.dk_area,
              w.month as month_of_year,
              w.hour as hour_of_day,
              w.wind_speed_mean_area as wind_speed_avg,
              w.wind_speed_max_area as wind_speed_max,
              w.wind_dir_sin_area as wind_direction_sin,
              w.wind_dir_cos_area as wind_direction_cos,
              w.radia_glob_past1h_area as solar_radiation_1h,
              w.sun_last1h_glob_area as sunshine_duration_1h,
              w.cloud_cover_mean_area as cloud_cover_avg,
              w.n_stations_wind,
              w.n_stations_solar,
              p.total_production_mwh,
              c.total_consumption_mwh
            FROM weather_wind_solar_area_hourly w
            LEFT JOIN (
              SELECT
                p.year, p.month, p.day, p.hour, m.dk_area,
                ROUND(SUM(
                  COALESCE(p.SolarMWh, 0) +
                  COALESCE(p.OffshoreWindLt100MW_MWh, 0) +
                  COALESCE(p.OffshoreWindGe100MW_MWh, 0) +
                  COALESCE(p.OnshoreWindMWh, 0) +
                  COALESCE(p.ThermalPowerMWh, 0)
                ), 2) as total_production_mwh
              FROM energy_production p
              JOIN municipality_metadata m ON p.MunicipalityNo = m.municipality_code
              WHERE p.year >= 2021
              GROUP BY p.year, p.month, p.day, p.hour, m.dk_area
            ) p ON w.dk_area = p.dk_area AND w.year = p.year AND w.month = p.month AND w.day = p.day AND w.hour = p.hour
            LEFT JOIN (
              SELECT year, month, day, hour, PriceArea as dk_area,
                ROUND(SUM(ShareMWh), 2) as total_consumption_mwh
              FROM consumption_coverage_location
              WHERE year >= 2021
              GROUP BY year, month, day, hour, PriceArea
            ) c ON w.dk_area = c.dk_area AND w.year = c.year AND w.month = c.month AND w.day = c.day AND w.hour = c.hour
            WHERE w.year >= 2021
              AND p.total_production_mwh IS NOT NULL
              AND c.total_consumption_mwh IS NOT NULL;

            SELECT 'Data inserted successfully!' as status;

            -- Verify table
            SELECT COUNT(*) as total_records FROM ml_training_data;

            -- Show sample
            SELECT * FROM ml_training_data ORDER BY year DESC, month DESC, day DESC, hour DESC LIMIT 5;

            EOF

            echo "ML training table created and populated successfully!"

      restartPolicy: Never
  backoffLimit: 1
