apiVersion: batch/v1
kind: Job
metadata:
  name: copy-weather-raw-to-hdfs
  namespace: bd-bd-gr-08
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: hdfs-copier
        image: rtdl/hive-metastore:3.1.2
        command:
          - /bin/bash
          - -c
          - |
            set -e

            export HADOOP_HOME=/opt/hadoop-3.3.1
            export PATH=$HADOOP_HOME/bin:$PATH

            echo "📦 Configuring HDFS client..."

            cat > $HADOOP_HOME/etc/hadoop/core-site.xml <<'HDFS_CONFIG'
            <?xml version="1.0"?>
            <configuration>
              <property>
                <name>fs.defaultFS</name>
                <value>hdfs://namenode:9000</value>
              </property>
            </configuration>
            HDFS_CONFIG

            echo "🧹 Preparing HDFS directory..."
            hdfs dfs -mkdir -p /user/hive/warehouse/weather_raw

            echo "📤 Copying ALL monthly weather data to HDFS..."
            hdfs dfs -put -f /data/weather_raw_long/* /user/hive/warehouse/weather_raw/

            echo "✅ Copy complete"

            echo ""
            echo "📂 HDFS verification:"
            hdfs dfs -ls -R /user/hive/warehouse/weather_raw
        volumeMounts:
        - name: data-storage
          mountPath: /data
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: weather-data-pvc
