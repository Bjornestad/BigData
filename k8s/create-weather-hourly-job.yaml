apiVersion: batch/v1
kind: Job
metadata:
  name: create-weather-hourly-table
  namespace: bd-bd-gr-08
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: spark
          image: eclipse-temurin:17-jre
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              echo "Installing dependencies..."
              apt-get update -qq && apt-get install -y -qq python3 python3-pip > /dev/null 2>&1
              pip3 install -q --no-cache-dir --break-system-packages pyspark==4.1.0 pandas numpy

              echo "Running create_weather_area_hourly_raw_params.py..."
              cd /app/SparkML
              python3 create_weather_area_hourly_raw_params.py
          env:
            - name: HIVE_METASTORE_URI
              value: "thrift://hive-metastore:9083"
            - name: HDFS_WAREHOUSE
              value: "hdfs://namenode:9000/user/hive/warehouse"
            - name: JAVA_HOME
              value: "/opt/java/openjdk"
          volumeMounts:
            - name: code
              mountPath: /app
          resources:
            requests:
              memory: "6Gi"
              cpu: "2"
            limits:
              memory: "12Gi"
              cpu: "4"
      volumes:
        - name: code
          persistentVolumeClaim:
            claimName: weather-data-pvc
