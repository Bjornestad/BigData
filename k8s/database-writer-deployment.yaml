apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-writer
  namespace: power-grid-monitor
  labels:
    app: database-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database-writer
  template:
    metadata:
      labels:
        app: database-writer
    spec:
      containers:
      - name: database-writer
        image: power-grid-database-writer:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: power-grid-config
              key: KAFKA_BROKERS
        - name: ACTUAL_TOPIC
          valueFrom:
            configMapKeyRef:
              name: power-grid-config
              key: ACTUAL_TOPIC
        - name: PREDICTED_TOPIC
          valueFrom:
            configMapKeyRef:
              name: power-grid-config
              key: PREDICTED_TOPIC
        - name: CONSUMER_GROUP
          value: "database-writer"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: timescaledb-secret
              key: connection-string
        - name: BATCH_SIZE
          value: "1000"
        - name: FLUSH_INTERVAL
          value: "10000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pgrep -f "node index.js"
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pgrep -f "node index.js"
          initialDelaySeconds: 10
          periodSeconds: 5
