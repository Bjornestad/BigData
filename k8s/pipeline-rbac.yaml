---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-waiter
  namespace: bd-bd-gr-08

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-waiter-role
  namespace: bd-bd-gr-08
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-waiter-binding
  namespace: bd-bd-gr-08
subjects:
- kind: ServiceAccount
  name: pipeline-waiter
  namespace: bd-bd-gr-08
roleRef:
  kind: Role
  name: pipeline-waiter-role
  apiGroup: rbac.authorization.k8s.io
