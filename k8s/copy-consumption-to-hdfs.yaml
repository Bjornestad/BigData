apiVersion: batch/v1
kind: Job
metadata:
  name: copy-consumption-to-hdfs
  namespace: bd-bd-gr-08
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: hdfs-copier
        image: rtdl/hive-metastore:3.1.2
        command:
          - /bin/bash
          - -c
          - |
            set -e

            export HADOOP_HOME=/opt/hadoop-3.3.1
            export PATH=$HADOOP_HOME/bin:$PATH

            echo "📦 Configuring HDFS client..."

            cat > $HADOOP_HOME/etc/hadoop/core-site.xml <<'HDFS_CONFIG'
            <?xml version="1.0"?>
            <configuration>
              <property>
                <name>fs.defaultFS</name>
                <value>hdfs://namenode:9000</value>
              </property>
            </configuration>
            HDFS_CONFIG

            echo "📁 Checking files in local directory..."
            ls -lh /data/*.parquet | grep consumption

            echo ""
            echo "🧹 Creating HDFS directory..."
            hdfs dfs -mkdir -p /user/hive/warehouse/consumption_data

            echo "📤 Copying consumption data to HDFS..."
            hdfs dfs -put -f /data/consumption_data.parquet /user/hive/warehouse/consumption_data/

            echo "✅ Copy complete"
            echo ""

            echo "📂 Verification - Files in HDFS:"
            hdfs dfs -ls /user/hive/warehouse/consumption_data/
            echo ""
            echo "Total size:"
            hdfs dfs -du -s -h /user/hive/warehouse/consumption_data/

        volumeMounts:
        - name: data-storage
          mountPath: /data
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: weather-data-pvc
