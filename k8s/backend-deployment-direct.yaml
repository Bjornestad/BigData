apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bd-bd-gr-08
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: node:18-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Installing dependencies..."
            cd /app/backend
            npm install

            echo "Starting backend server..."
            node server.js
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: backend-config
        volumeMounts:
        - name: code
          mountPath: /app
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: code
        persistentVolumeClaim:
          claimName: weather-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: bd-bd-gr-08
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: backend
