apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: power-grid-monitor
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: power-grid-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: power-grid-config
              key: KAFKA_BROKERS
        - name: ACTUAL_TOPIC
          valueFrom:
            configMapKeyRef:
              name: power-grid-config
              key: ACTUAL_TOPIC
        - name: PREDICTED_TOPIC
          valueFrom:
            configMapKeyRef:
              name: power-grid-config
              key: PREDICTED_TOPIC
        - name: CONSUMER_GROUP
          value: "power-grid-monitor"
        - name: PORT
          value: "8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: timescaledb-secret
              key: connection-string
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: power-grid-monitor
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
