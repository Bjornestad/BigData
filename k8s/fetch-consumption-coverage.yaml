apiVersion: batch/v1
kind: Job
metadata:
  name: fetch-consumption-coverage
  namespace: bd-bd-gr-08
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: fetcher
        image: python:3.11-slim
        env:
        - name: DATA_DIR
          value: "/data"
        command:
          - /bin/bash
          - -c
          - |
            set -e

            echo "================================================"
            echo "CONSUMPTION COVERAGE DATA FETCH"
            echo "================================================"
            echo "Dataset: ConsumptionCoverageLocationBased"
            echo "Date range: 2013-01-01 to present"
            echo "Total records expected: ~1.7M"
            echo "================================================"
            echo ""

            echo "📦 Installing dependencies..."
            pip install --quiet requests pandas pyarrow tqdm

            echo ""
            echo "🚀 Starting data fetch..."
            echo ""

            python3 /scripts/fetch_consumption_coverage.py

            echo ""
            echo "================================================"
            echo "✅ FETCH COMPLETE"
            echo "================================================"

            # Verify output
            if [ -f /data/consumption_coverage_location.parquet ]; then
              echo "✓ Parquet file created"
              ls -lh /data/consumption_coverage_location.parquet
            else
              echo "✗ ERROR: Parquet file not found!"
              exit 1
            fi

        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: data-storage
          mountPath: /data
      volumes:
      - name: scripts
        configMap:
          name: fetch-scripts
      - name: data-storage
        persistentVolumeClaim:
          claimName: weather-data-pvc
