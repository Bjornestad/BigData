apiVersion: batch/v1
kind: Job
metadata:
  name: fix-station-names
  namespace: bd-bd-gr-08
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: fix-names
        image: python:3.12-slim
        resources:
          requests:
            memory: "8Gi"
            cpu: "2000m"
          limits:
            memory: "16Gi"
            cpu: "4000m"
        command:
          - /bin/bash
          - -c
          - |
            set -e

            echo "📦 Installing dependencies..."
            pip install -q pandas pyarrow requests

            # Install HDFS client
            apt-get update -qq && apt-get install -y -qq openjdk-17-jre-headless wget > /dev/null

            cd /tmp
            wget -q https://archive.apache.org/dist/hadoop/common/hadoop-3.3.1/hadoop-3.3.1.tar.gz
            tar -xzf hadoop-3.3.1.tar.gz

            export HADOOP_HOME=/tmp/hadoop-3.3.1
            export PATH=$HADOOP_HOME/bin:$PATH
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

            # Configure HDFS client
            cat > $HADOOP_HOME/etc/hadoop/core-site.xml <<'HDFS_CONFIG'
            <?xml version="1.0"?>
            <configuration>
              <property>
                <name>fs.defaultFS</name>
                <value>hdfs://namenode:9000</value>
              </property>
            </configuration>
            HDFS_CONFIG

            echo "✓ HDFS client configured"

            # Now run the Python script to fix station names
            python3 -u <<'PYTHON'
            import os
            import sys
            import pandas as pd
            import subprocess
            from pathlib import Path

            print("="*70)
            print("🔧 FIXING STATION NAMES IN WEATHER DATA")
            print("="*70)
            sys.stdout.flush()

            # Fetch station name mapping from DMI API
            print("\n📡 Fetching station names from DMI API...")
            sys.stdout.flush()

            import requests
            API_KEY = "b5800a05-4f0f-4584-b130-6129213728c0"
            stations_url = "https://dmigw.govcloud.dk/v2/metObs/collections/station/items"

            params = {'api-key': API_KEY, 'limit': 2000}
            response = requests.get(stations_url, params=params, timeout=60)

            if response.status_code == 200:
                data = response.json()
                features = data.get('features', [])

                # Create mapping - only Danish stations (05xxx and 06xxx)
                station_map = {}
                for feature in features:
                    props = feature.get('properties', {})
                    station_id = props.get('stationId')
                    station_name = props.get('name')

                    if station_id and isinstance(station_id, str):
                        # Only include Danish SYNOP/PLUVIO stations
                        if station_id.startswith('05') or station_id.startswith('06'):
                            if len(station_id) == 5:  # Ensure it's 5 digits
                                station_map[station_id] = station_name if station_name else station_id

                print(f"✓ Loaded {len(station_map)} Danish station names")
                sys.stdout.flush()
            else:
                print(f"✗ Failed to fetch station names: {response.status_code}")
                sys.exit(1)

            # List all parquet files in HDFS
            print("\n📁 Listing parquet files in HDFS...")
            sys.stdout.flush()

            result = subprocess.run(
                ['hdfs', 'dfs', '-ls', '/user/hive/warehouse/weather_raw'],
                capture_output=True,
                text=True
            )

            parquet_files = []
            for line in result.stdout.split('\n'):
                if '.parquet' in line:
                    parts = line.split()
                    if len(parts) >= 8:
                        hdfs_path = parts[-1]
                        parquet_files.append(hdfs_path)

            print(f"✓ Found {len(parquet_files)} parquet files in HDFS")
            sys.stdout.flush()

            # Process each file
            os.makedirs('/tmp/weather_fixed', exist_ok=True)

            total_files = len(parquet_files)
            files_updated = 0
            total_records_updated = 0

            for idx, hdfs_path in enumerate(parquet_files, 1):
                filename = hdfs_path.split('/')[-1]
                local_path = f'/tmp/weather_original/{filename}'
                fixed_path = f'/tmp/weather_fixed/{filename}'

                print(f"\n[{idx}/{total_files}] Processing {filename}...")
                sys.stdout.flush()

                # Download from HDFS
                os.makedirs('/tmp/weather_original', exist_ok=True)
                subprocess.run(
                    ['hdfs', 'dfs', '-get', hdfs_path, local_path],
                    check=True,
                    capture_output=True
                )

                # Load parquet file
                df = pd.read_parquet(local_path)

                # Count records with missing names (where station_name == station_id)
                missing_names = (df['station_id'] == df['station_name']).sum()

                if missing_names == 0:
                    print(f"  ✓ All stations already have proper names")
                    continue

                print(f"  Found {missing_names:,} records with missing names")

                # Update station names
                records_updated = 0
                for station_id, station_name in station_map.items():
                    mask = (df['station_id'] == station_id) & (df['station_name'] == station_id)
                    count = mask.sum()
                    if count > 0:
                        df.loc[mask, 'station_name'] = station_name
                        records_updated += count

                print(f"  ✓ Updated {records_updated:,} records")
                total_records_updated += records_updated

                # Save corrected file
                df.to_parquet(fixed_path, engine='pyarrow', compression='snappy', index=False)

                # Upload back to HDFS (overwrite)
                subprocess.run(
                    ['hdfs', 'dfs', '-put', '-f', fixed_path, hdfs_path],
                    check=True,
                    capture_output=True
                )

                files_updated += 1
                print(f"  ✓ Uploaded corrected file to HDFS")
                sys.stdout.flush()

                # Clean up local files to save space
                os.remove(local_path)
                os.remove(fixed_path)

            print("\n" + "="*70)
            print("✅ STATION NAME FIX COMPLETE")
            print(f"   Files processed: {total_files}")
            print(f"   Files updated: {files_updated}")
            print(f"   Total records updated: {total_records_updated:,}")
            print("="*70)
            sys.stdout.flush()

            PYTHON
        volumeMounts:
        - name: data-storage
          mountPath: /data
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: weather-data-pvc
