apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-energy-actual-fetcher
  namespace: bd-bd-gr-08
spec:
  replicas: 1
  selector:
    matchLabels:
      app: realtime-energy-actual-fetcher
  template:
    metadata:
      labels:
        app: realtime-energy-actual-fetcher
    spec:
      containers:
      - name: fetcher
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "Installing dependencies..."
            pip install -q --no-cache-dir requests confluent-kafka[avro] attrs httpx

            echo "Starting actual energy data fetcher..."
            cd /app/scripts
            python3 fetch_realtime_energy.py
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-bootstrap:9092"
        - name: SCHEMA_REGISTRY_URL
          value: "http://kafka-schema-registry:8081"
        - name: ENERGY_KAFKA_TOPIC
          value: "energy_actual"
        - name: ENERGY_FETCH_INTERVAL
          value: "600"  # 10 minutes
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        persistentVolumeClaim:
          claimName: weather-data-pvc
      restartPolicy: Always
