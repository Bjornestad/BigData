apiVersion: batch/v1
kind: Job
metadata:
  name: copy-original-61-stations
  namespace: bd-bd-gr-08
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: hdfs-copier
        image: rtdl/hive-metastore:3.1.2
        command:
          - /bin/bash
          - -c
          - |
            set -e

            export HADOOP_HOME=/opt/hadoop-3.3.1
            export PATH=$HADOOP_HOME/bin:$PATH

            cat > $HADOOP_HOME/etc/hadoop/core-site.xml <<'HDFS_CONFIG'
            <?xml version="1.0"?>
            <configuration>
              <property>
                <name>fs.defaultFS</name>
                <value>hdfs://namenode:9000</value>
              </property>
            </configuration>
            HDFS_CONFIG

            echo "📤 Copying ORIGINAL 61-station data (weather_raw_long) to HDFS..."
            echo "Files in PVC:"
            ls -lh /data/weather_raw_long/*.parquet | wc -l
            echo ""

            # Copy with prefix to avoid naming conflict
            cd /data/weather_raw_long
            for file in *.parquet; do
              # Rename to add 'orig_' prefix to distinguish from new stations
              new_name="orig_${file}"
              hdfs dfs -put "$file" "/user/hive/warehouse/weather_raw/${new_name}"
              echo "Copied $file as $new_name"
            done

            echo ""
            echo "✅ Copy complete"
            echo ""
            echo "Total files in HDFS weather_raw:"
            hdfs dfs -ls /user/hive/warehouse/weather_raw/ | grep parquet | wc -l

        volumeMounts:
        - name: data-storage
          mountPath: /data
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: weather-data-pvc
