apiVersion: batch/v1
kind: Job
metadata:
  name: create-hive-tables-final
  namespace: bd-bd-gr-08
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: hive-client
        image: rtdl/hive-metastore:3.1.2
        command:
          - /bin/bash
          - -c
          - |
            export HADOOP_HOME=/opt/hadoop-3.3.1
            export HIVE_HOME=/opt/apache-hive-metastore-3.1.2-bin
            export PATH=$HIVE_HOME/bin:$HADOOP_HOME/bin:$PATH

            echo "Waiting for HiveServer2..."
            until beeline -u "jdbc:hive2://hiveserver2:10000" -e "SHOW DATABASES;" 2>/dev/null; do
              sleep 5
            done

            echo "Creating Hive table schemas..."
            beeline -u "jdbc:hive2://hiveserver2:10000" <<'SQL'

            -- Raw long-format observations (source data)
            DROP TABLE IF EXISTS weather_observations_raw;
            CREATE EXTERNAL TABLE weather_observations_raw (
              station_id STRING,
              station_name STRING,
              timestamp STRING,
              parameter_id STRING,
              value DOUBLE,
              latitude DOUBLE,
              longitude DOUBLE,
              year INT,
              month INT,
              day INT,
              hour INT,
              minute INT
            )
            STORED AS PARQUET
            LOCATION 'hdfs://namenode:9000/user/hive/warehouse/weather_raw/';

            -- Wide-format table (for ML - core params NOT NULL)
            DROP TABLE IF EXISTS weather_wide;
            CREATE TABLE weather_wide (
              station_id STRING,
              station_name STRING,
              latitude DOUBLE,
              longitude DOUBLE,
              year INT,
              month INT,
              day INT,
              hour INT,
              minute INT,
              temp_dry DOUBLE,
              temp_dew DOUBLE,
              humidity DOUBLE,
              wind_speed DOUBLE,
              wind_dir DOUBLE,
              pressure DOUBLE
            )
            STORED AS PARQUET;

            -- Energy production table
            DROP TABLE IF EXISTS energy_production;
            CREATE EXTERNAL TABLE energy_production (
              hour_utc STRING,
              hour_dk STRING,
              price_area STRING,
              municipality_code INT,
              municipality_name STRING,
              fuel_code INT,
              fuel_name STRING,
              production_mwh DOUBLE,
              year INT,
              month INT,
              day INT
            )
            STORED AS PARQUET
            LOCATION 'hdfs://namenode:9000/user/hive/warehouse/energy_production/';

            SHOW TABLES;
            SQL

            echo "✅ Hive table schemas created!"
            echo "Tables: weather_observations_raw (long), weather_wide (wide, NULL-filtered), energy_production"
