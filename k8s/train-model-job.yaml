apiVersion: batch/v1
kind: Job
metadata:
  name: train-ml-model
  namespace: bd-bd-gr-08
spec:
  # Allow up to 2 hours for training
  activeDeadlineSeconds: 7200
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: train-model
    spec:
      restartPolicy: Never
      containers:
      - name: trainer
        image: eclipse-temurin:17-jre
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "Installing dependencies..."
            apt-get update -qq && apt-get install -y -qq python3 python3-pip > /dev/null 2>&1
            pip3 install -q --no-cache-dir --break-system-packages pyspark==4.1.0 pandas numpy

            echo "============================================================"
            echo "TRAINING ML MODEL"
            echo "============================================================"

            cd /app/SparkML
            python3 train_consumption_model.py

            echo ""
            echo "============================================================"
            echo "MODEL TRAINING COMPLETE"
            echo "============================================================"
            echo "The trained model is saved in:"
            echo "  /app/SparkML/models/energy_consumption_model_<timestamp>/"
            echo ""
            echo "Next step: Start the prediction service with the model path"
            echo "============================================================"
        env:
        - name: HIVE_METASTORE_URI
          value: "thrift://hive-metastore:9083"
        - name: HDFS_WAREHOUSE
          value: "hdfs://namenode:9000/user/hive/warehouse"
        - name: JAVA_HOME
          value: "/opt/java/openjdk"
        volumeMounts:
        - name: code
          mountPath: /app
        resources:
          requests:
            memory: "6Gi"
            cpu: "2"
          limits:
            memory: "12Gi"
            cpu: "4"
      volumes:
      - name: code
        persistentVolumeClaim:
          claimName: weather-data-pvc
