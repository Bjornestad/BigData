  fetch_november_test.py: |
    import os
    import requests
    import pandas as pd
    from datetime import datetime
    import time

    # Import configuration
    exec(open('/scripts/config.py').read())

    # Configuration
    DMI_API_URL = "https://dmigw.govcloud.dk/v2/metObs/collections/observation/items"
    ENERGY_API_URL = "https://api.energidataservice.dk/dataset/ProductionMunicipalityHour"
    DMI_API_KEY = os.getenv("API_KEY")
    DATA_DIR = os.getenv("DATA_DIR", "/data")

    # November 2025 date range
    START_DATE = datetime(2025, 11, 1, 0, 0, 0)
    END_DATE = datetime(2025, 11, 30, 23, 59, 59)

    REQUESTS_DELAY = 0.5
    MAX_RETRIES = 3

    def fetch_station_all_parameters(station_id, start_date, end_date, limit=300000):
        """Fetch all parameters for a station at once."""
        params = {
            "stationId": station_id,
            "datetime": f"{start_date.strftime('%Y-%m-%dT%H:%M:%SZ')}/{end_date.strftime('%Y-%m-%dT%H:%M:%SZ')}",
            "api-key": DMI_API_KEY,
            "limit": limit,
        }

        for attempt in range(MAX_RETRIES):
            try:
                response = requests.get(DMI_API_URL, params=params, timeout=120)
                if response.status_code == 200:
                    data = response.json()
                    if isinstance(data, dict) and "features" in data:
                        return data["features"]
                    return []
                elif response.status_code == 404:
                    return []
                else:
                    if attempt < MAX_RETRIES - 1:
                        time.sleep(2 ** attempt)
                        continue
                    return []
            except Exception as e:
                if attempt < MAX_RETRIES - 1:
                    time.sleep(2 ** attempt)
                    continue
                return []
        return []

    def process_dmi_records(records):
        processed_data = []
        for record in records:
            properties = record.get("properties", {})
            geometry = record.get("geometry", {})
            coordinates = geometry.get("coordinates", [None, None])
            station_id = properties.get("stationId")
            processed_record = {
                "station_id": station_id,
                "station_name": STATION_NAMES.get(station_id, "Unknown"),
                "parameter_id": properties.get("parameterId"),
                "timestamp": properties.get("observed"),
                "value": properties.get("value"),
                "longitude": coordinates[0] if len(coordinates) > 0 else None,
                "latitude": coordinates[1] if len(coordinates) > 1 else None,
            }
            processed_data.append(processed_record)
        return processed_data

    def fetch_energy_data(start_date, end_date):
        params = {
            "start": start_date.strftime('%Y-%m-%dT%H:%M'),
            "end": end_date.strftime('%Y-%m-%dT%H:%M'),
            "limit": 0,
            "sort": "HourDK"
        }
        for attempt in range(MAX_RETRIES):
            try:
                response = requests.get(ENERGY_API_URL, params=params, timeout=120)
                if response.status_code == 200:
                    return response.json().get('records', [])
                else:
                    if attempt < MAX_RETRIES - 1:
                        time.sleep(2 ** attempt)
                        continue
                    return []
            except Exception as e:
                if attempt < MAX_RETRIES - 1:
                    time.sleep(2 ** attempt)
                    continue
                return []
        return []

    # Main execution
    print("🚀 Fetching November 2025 Test Data")
    print(f"Date Range: {START_DATE.date()} to {END_DATE.date()}")
    print(f"Stations: {len(SYNOP_STATIONS)}")
    print(f"Strategy: All parameters per station (single query per station)")
    print()

    os.makedirs(DATA_DIR, exist_ok=True)

    # Fetch DMI Weather Data
    print("📊 DMI Weather Data")
    all_records = []

    for i, station_id in enumerate(SYNOP_STATIONS, 1):
        print(f"[{i}/{len(SYNOP_STATIONS)}] {station_id} ({STATION_NAMES.get(station_id, 'Unknown')})", flush=True)
        records = fetch_station_all_parameters(station_id, START_DATE, END_DATE)
        if records:
            all_records.extend(process_dmi_records(records))
        time.sleep(REQUESTS_DELAY)

    if all_records:
        df = pd.DataFrame(all_records)
        df["timestamp"] = pd.to_datetime(df["timestamp"])
        df["value"] = pd.to_numeric(df["value"], errors="coerce")
        df = df.dropna(subset=["timestamp", "value"])
        df = df.sort_values(["station_id", "parameter_id", "timestamp"]).reset_index(drop=True)
        df["date"] = df["timestamp"].dt.date
        df["hour"] = df["timestamp"].dt.hour
        df["year"] = df["timestamp"].dt.year
        df["month"] = df["timestamp"].dt.month
        df["day"] = df["timestamp"].dt.day

        output_file = os.path.join(DATA_DIR, "dmi_weather_november_2025.parquet")
        df.to_parquet(output_file, engine="pyarrow", compression="snappy", index=False)
        print(f"✓ DMI: {len(df)} records, {df['parameter_id'].nunique()} parameters")

    # Fetch Energy Data
    print()
    print("⚡ Energy Production Data")
    energy_records = fetch_energy_data(START_DATE, END_DATE)

    if energy_records:
        df = pd.DataFrame(energy_records)
        if 'HourUTC' in df.columns:
            df['timestamp'] = pd.to_datetime(df['HourUTC'])
        elif 'HourDK' in df.columns:
            df['timestamp'] = pd.to_datetime(df['HourDK'])
        for col in ['ProductionGe100kW', 'ProductionLt100kW', 'Production']:
            if col in df.columns:
                df[col] = pd.to_numeric(df[col], errors='coerce')
        df['date'] = df['timestamp'].dt.date
        df['hour'] = df['timestamp'].dt.hour
        df['year'] = df['timestamp'].dt.year
        df['month'] = df['timestamp'].dt.month
        df['day'] = df['timestamp'].dt.day
        df = df.drop_duplicates()

        output_file = os.path.join(DATA_DIR, "energy_production_november_2025.parquet")
        df.to_parquet(output_file, engine="pyarrow", compression="snappy", index=False)
        print(f"✓ Energy: {len(df)} records")

    print()
    print("✅ November 2025 test complete!")
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weather-data-pvc
  namespace: bd-bd-gr-08
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: november-test
  namespace: bd-bd-gr-08
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: november-test
    spec:
      restartPolicy: OnFailure
      containers:
      - name: fetcher
        image: python:3.12-slim
        command:
          - /bin/bash
          - -c
          - |
            pip install --no-cache-dir requests pandas pyarrow &&
            python /scripts/fetch_november_test.py
        env:
        - name: DATA_DIR
          value: "/data"
        - name: API_KEY
          valueFrom:
            configMapKeyRef:
              name: dmi-api-config
              key: API_KEY
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: data-storage
          mountPath: /data
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: weather-data-pvc
      - name: scripts
        configMap:
          name: november-test-script
