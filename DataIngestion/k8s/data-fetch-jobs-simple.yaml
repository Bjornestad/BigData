  fetch_year_worker.py: |
    import os
    import sys
    from datetime import datetime
    import requests
    import pandas as pd
    import time

    # Import config
    exec(open('/scripts/config.py').read())

    # Config
    DMI_API_URL = "https://dmigw.govcloud.dk/v2/metObs/collections/observation/items"
    ENERGY_API_URL = "https://api.energidataservice.dk/dataset/ProductionMunicipalityHour"
    DMI_API_KEY = os.getenv("API_KEY")
    DATA_DIR = os.getenv("DATA_DIR", "/data")
    REQUESTS_DELAY = 0.5
    MAX_RETRIES = 3

    def fetch_dmi_data(station_id, parameter_id, start_date, end_date, limit=300000):
        params = {
            "stationId": station_id,
            "parameterId": parameter_id,
            "datetime": f"{start_date.strftime('%Y-%m-%dT%H:%M:%SZ')}/{end_date.strftime('%Y-%m-%dT%H:%M:%SZ')}",
            "api-key": DMI_API_KEY,
            "limit": limit,
        }
        for attempt in range(MAX_RETRIES):
            try:
                response = requests.get(DMI_API_URL, params=params, timeout=120)
                if response.status_code == 200:
                    data = response.json()
                    if isinstance(data, dict) and "features" in data:
                        return data["features"]
                    return []
                elif response.status_code == 404:
                    return []
                else:
                    if attempt < MAX_RETRIES - 1:
                        time.sleep(2 ** attempt)
                        continue
                    return []
            except Exception as e:
                if attempt < MAX_RETRIES - 1:
                    time.sleep(2 ** attempt)
                    continue
                return []
        return []

    def process_dmi_records(records):
        processed_data = []
        for record in records:
            properties = record.get("properties", {})
            geometry = record.get("geometry", {})
            coordinates = geometry.get("coordinates", [None, None])
            station_id = properties.get("stationId")
            processed_record = {
                "station_id": station_id,
                "station_name": STATION_NAMES.get(station_id, "Unknown"),
                "parameter_id": properties.get("parameterId"),
                "timestamp": properties.get("observed"),
                "value": properties.get("value"),
                "longitude": coordinates[0] if len(coordinates) > 0 else None,
                "latitude": coordinates[1] if len(coordinates) > 1 else None,
            }
            processed_data.append(processed_record)
        return processed_data

    def fetch_energy_data(start_date, end_date):
        params = {
            "start": start_date.strftime('%Y-%m-%dT%H:%M'),
            "end": end_date.strftime('%Y-%m-%dT%H:%M'),
            "limit": 0,
            "sort": "HourDK"
        }
        for attempt in range(MAX_RETRIES):
            try:
                response = requests.get(ENERGY_API_URL, params=params, timeout=120)
                if response.status_code == 200:
                    return response.json()
                else:
                    if attempt < MAX_RETRIES - 1:
                        time.sleep(2 ** attempt)
                        continue
                    return None
            except Exception as e:
                if attempt < MAX_RETRIES - 1:
                    time.sleep(2 ** attempt)
                    continue
                return None
        return None

    # Main execution
    year = int(os.getenv("YEAR", sys.argv[1] if len(sys.argv) > 1 else datetime.now().year))
    print(f"🚀 Fetching data for year {year}")

    start_date = datetime(year, 1, 1)
    end_date = datetime.now() if year == datetime.now().year else datetime(year, 12, 31, 23, 59, 59)

    # Fetch DMI data
    print(f"\n=== DMI Weather Data ===")
    all_records = []
    total = len(SYNOP_STATIONS) * len(ALL_PARAMETERS)
    count = 0

    for station_id in SYNOP_STATIONS:
        for parameter_id in ALL_PARAMETERS:
            count += 1
            print(f"[{count}/{total}] {station_id}/{parameter_id}", flush=True)
            records = fetch_dmi_data(station_id, parameter_id, start_date, end_date)
            if records:
                all_records.extend(process_dmi_records(records))
            time.sleep(REQUESTS_DELAY)

    if all_records:
        df = pd.DataFrame(all_records)
        df["timestamp"] = pd.to_datetime(df["timestamp"])
        df["value"] = pd.to_numeric(df["value"], errors="coerce")
        df = df.dropna(subset=["timestamp", "value"])
        df = df.sort_values(["station_id", "parameter_id", "timestamp"]).reset_index(drop=True)
        df["date"] = df["timestamp"].dt.date
        df["hour"] = df["timestamp"].dt.hour
        df["year"] = df["timestamp"].dt.year
        df["month"] = df["timestamp"].dt.month
        df["day"] = df["timestamp"].dt.day

        output_file = os.path.join(DATA_DIR, f"dmi_weather_{year}.parquet")
        os.makedirs(DATA_DIR, exist_ok=True)
        df.to_parquet(output_file, engine="pyarrow", compression="snappy", index=False)
        print(f"✓ DMI: {len(df)} records saved to {output_file}")

    # Fetch Energy data
    print(f"\n=== Energy Production Data ===")
    result = fetch_energy_data(start_date, end_date)
    if result:
        energy_records = result.get('records', [])
        if energy_records:
            df = pd.DataFrame(energy_records)
            if 'HourUTC' in df.columns:
                df['timestamp'] = pd.to_datetime(df['HourUTC'])
            elif 'HourDK' in df.columns:
                df['timestamp'] = pd.to_datetime(df['HourDK'])
            for col in ['ProductionGe100kW', 'ProductionLt100kW', 'Production']:
                if col in df.columns:
                    df[col] = pd.to_numeric(df[col], errors='coerce')
            df['date'] = df['timestamp'].dt.date
            df['hour'] = df['timestamp'].dt.hour
            df['year'] = df['timestamp'].dt.year
            df['month'] = df['timestamp'].dt.month
            df['day'] = df['timestamp'].dt.day
            df = df.drop_duplicates()

            output_file = os.path.join(DATA_DIR, f"energy_production_{year}.parquet")
            df.to_parquet(output_file, engine="pyarrow", compression="snappy", index=False)
            print(f"✓ Energy: {len(df)} records saved to {output_file}")

    print(f"\n✅ Year {year} complete!")
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weather-data-pvc
  namespace: bd-bd-gr-08
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
---
# Job for year 2021
apiVersion: batch/v1
kind: Job
metadata:
  name: data-fetch-2021
  namespace: bd-bd-gr-08
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: data-fetch
        year: "2021"
    spec:
      restartPolicy: OnFailure
      containers:
      - name: fetcher
        image: python:3.12-slim
        command:
          - /bin/bash
          - -c
          - |
            pip install --no-cache-dir requests pandas pyarrow &&
            python /scripts/fetch_year_worker.py
        env:
        - name: YEAR
          value: "2021"
        - name: DATA_DIR
          value: "/data"
        - name: API_KEY
          valueFrom:
            configMapKeyRef:
              name: dmi-api-config
              key: API_KEY
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: data-storage
          mountPath: /data
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: weather-data-pvc
      - name: scripts
        configMap:
          name: fetch-scripts
---
