services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - power-grid-network

  # Kafka broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - power-grid-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # TimescaleDB
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: power_grid
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - power-grid-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Database Writer Service
  database-writer:
    build:
      context: ./database-writer
      dockerfile: Dockerfile
    container_name: database-writer
    environment:
      KAFKA_BROKERS: kafka:29092
      ACTUAL_TOPIC: power-consumption-actual
      PREDICTED_TOPIC: power-consumption-predicted
      CONSUMER_GROUP: database-writer
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/power_grid
      BATCH_SIZE: 1000
      FLUSH_INTERVAL: 10000
      HEALTH_PORT: 8081
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - power-grid-network
    restart: unless-stopped

  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: power-grid-backend
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
      ACTUAL_TOPIC: power-consumption-actual
      PREDICTED_TOPIC: power-consumption-predicted
      CONSUMER_GROUP: power-grid-monitor
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/power_grid
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - power-grid-network
    restart: unless-stopped

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: power-grid-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_BACKEND_URL: ws://localhost:8080
      REACT_APP_API_URL: http://localhost:8080
    depends_on:
      - backend
    networks:
      - power-grid-network
    restart: unless-stopped

  # Test data producer
  test-producer:
    build:
      context: ./kafka-test
      dockerfile: Dockerfile
    container_name: test-producer
    environment:
      KAFKA_BROKERS: kafka:29092
      ACTUAL_TOPIC: power-consumption-actual
      PREDICTED_TOPIC: power-consumption-predicted
      INTERVAL_MS: 2000
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - power-grid-network
    restart: unless-stopped

volumes:
  timescale_data:

networks:
  power-grid-network:
    driver: bridge
