apiVersion: v1
kind: ConfigMap
metadata:
  name: schema-files
  namespace: kafka
data:
  # 1. Energy Schema
  energy_production.avsc: |
    {
      "type": "record",
      "name": "EnergyProduction",
      "namespace": "com.energyproject",
      "fields": [
        { "name": "HourUTC", "type": "string", "doc": "ISO8601 Timestamp" },
        { "name": "HourDK", "type": "string", "doc": "Local Timestamp" },
        { "name": "MunicipalityNo", "type": "int" },
        { "name": "SolarMWh", "type": ["null", "double"], "default": null },
        { "name": "OffshoreWindLt100MW_MWh", "type": ["null", "double"], "default": null },
        { "name": "OffshoreWindGe100MW_MWh", "type": ["null", "double"], "default": null },
        { "name": "OnshoreWindMWh", "type": ["null", "double"], "default": null },
        { "name": "ThermalPowerMWh", "type": ["null", "double"], "default": null },
        { "name": "timestamp", "type": "string", "doc": "SQL Style Timestamp" },
        { "name": "date", "type": "string" },
        { "name": "hour", "type": "int" },
        { "name": "year", "type": "int" },
        { "name": "month", "type": "int" },
        { "name": "day", "type": "int" }
      ]
    }

  # 2. Weather Schema
  weather_station.avsc: |
    {
      "type": "record",
      "name": "WeatherStationData",
      "namespace": "com.energyproject",
      "fields": [
        { "name": "station_id", "type": "string", "doc": "String to preserve leading zeros (e.g. 06019)" },
        { "name": "station_name", "type": "string" },
        { "name": "timestamp", "type": "string", "doc": "ISO8601 with timezone" },
        { "name": "date", "type": "string" },
        { "name": "year", "type": "int" },
        { "name": "month", "type": "int" },
        { "name": "day", "type": "int" },
        { "name": "hour", "type": "int" },
        { "name": "minute", "type": "int" },
        { "name": "latitude", "type": "double" },
        { "name": "longitude", "type": "double" },
        { "name": "cloud_cover", "type": ["null", "double"], "default": null },
        { "name": "cloud_height", "type": ["null", "double"], "default": null },
        { "name": "humidity", "type": ["null", "double"], "default": null },
        { "name": "humidity_past1h", "type": ["null", "double"], "default": null },
        { "name": "leav_hum_dur_past10min", "type": ["null", "double"], "default": null },
        { "name": "leav_hum_dur_past1h", "type": ["null", "double"], "default": null },
        { "name": "precip_dur_past10min", "type": ["null", "double"], "default": null },
        { "name": "precip_dur_past1h", "type": ["null", "double"], "default": null },
        { "name": "precip_past10min", "type": ["null", "double"], "default": null },
        { "name": "precip_past1h", "type": ["null", "double"], "default": null },
        { "name": "precip_past1min", "type": ["null", "double"], "default": null },
        { "name": "pressure", "type": ["null", "double"], "default": null },
        { "name": "pressure_at_sea", "type": ["null", "double"], "default": null },
        { "name": "radia_glob", "type": ["null", "double"], "default": null },
        { "name": "radia_glob_past1h", "type": ["null", "double"], "default": null },
        { "name": "sun_last10min_glob", "type": ["null", "double"], "default": null },
        { "name": "sun_last1h_glob", "type": ["null", "double"], "default": null },
        { "name": "temp_dew", "type": ["null", "double"], "default": null },
        { "name": "temp_dry", "type": ["null", "double"], "default": null },
        { "name": "temp_grass", "type": ["null", "double"], "default": null },
        { "name": "temp_grass_max_past1h", "type": ["null", "double"], "default": null },
        { "name": "temp_grass_mean_past1h", "type": ["null", "double"], "default": null },
        { "name": "temp_grass_min_past1h", "type": ["null", "double"], "default": null },
        { "name": "temp_max_past12h", "type": ["null", "double"], "default": null },
        { "name": "temp_max_past1h", "type": ["null", "double"], "default": null },
        { "name": "temp_mean_past1h", "type": ["null", "double"], "default": null },
        { "name": "temp_min_past12h", "type": ["null", "double"], "default": null },
        { "name": "temp_min_past1h", "type": ["null", "double"], "default": null },
        { "name": "temp_soil", "type": ["null", "double"], "default": null },
        { "name": "temp_soil_max_past1h", "type": ["null", "double"], "default": null },
        { "name": "temp_soil_mean_past1h", "type": ["null", "double"], "default": null },
        { "name": "temp_soil_min_past1h", "type": ["null", "double"], "default": null },
        { "name": "visib_mean_last10min", "type": ["null", "double"], "default": null },
        { "name": "visibility", "type": ["null", "double"], "default": null },
        { "name": "weather", "type": ["null", "string"], "default": null },
        { "name": "wind_dir", "type": ["null", "double"], "default": null },
        { "name": "wind_dir_past1h", "type": ["null", "double"], "default": null },
        { "name": "wind_gust_always_past1h", "type": ["null", "double"], "default": null },
        { "name": "wind_max", "type": ["null", "double"], "default": null },
        { "name": "wind_max_per10min_past1h", "type": ["null", "double"], "default": null },
        { "name": "wind_min", "type": ["null", "double"], "default": null },
        { "name": "wind_min_past1h", "type": ["null", "double"], "default": null },
        { "name": "wind_speed", "type": ["null", "double"], "default": null },
        { "name": "wind_speed_past1h", "type": ["null", "double"], "default": null }
      ]
    }