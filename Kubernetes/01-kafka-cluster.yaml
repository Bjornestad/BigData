apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: energy-cluster
  namespace: kafka
spec:
  kafka:
    version: 3.6.0
    replicas: 1 # Running 3 brokers for high availability
    listeners:
      - name: plain
        port: 9092
        type: internal # For Spark/Connect inside the cluster
        tls: false
      - name: external
        port: 9094
        type: nodeport # For you to access from your laptop
        tls: false
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 20Gi
          deleteClaim: true
  zookeeper:
    replicas: 1
    storage:
      type: persistent-claim
      size: 10Gi
      deleteClaim: false
  entityOperator:
    topicOperator: {} # This manages your topics automatically
    userOperator: {}
    #Some values are set low to run on minikube