apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: weather-live-ingest
  labels:
    strimzi.io/cluster: energy-cluster
  namespace: kafka
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: 604800000 # 7 Days
