apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-service-hive
  namespace: bd-bd-gr-08
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prediction-service-hive
  template:
    metadata:
      labels:
        app: prediction-service-hive
    spec:
      containers:
      - name: predictor
        image: eclipse-temurin:17-jre
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "Installing Python and dependencies..."
            apt-get update -qq && apt-get install -y -qq python3 python3-pip procps

            echo "Installing Python packages..."
            pip3 install -q --no-cache-dir --break-system-packages kafka-python pyspark pandas numpy

            echo "Starting Hive-based prediction service..."
            cd /app/SparkML
            python3 predict_from_hive.py
        env:
        - name: JAVA_HOME
          value: "/opt/java/openjdk"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-bootstrap:9092"
        - name: OUTPUT_TOPIC
          value: "energy_predictions"
        - name: PRODUCTION_MODEL_PATH
          value: "/app/SparkML/models/energy_model_production_20251227_235847"
        - name: CONSUMPTION_MODEL_PATH
          value: "/app/SparkML/models/energy_model_consumption_20251227_235915"
        - name: CHECK_INTERVAL
          value: "300"  # Check every 5 minutes
        volumeMounts:
        - name: code
          mountPath: /app
      volumes:
      - name: code
        persistentVolumeClaim:
          claimName: weather-data-pvc
      restartPolicy: Always
